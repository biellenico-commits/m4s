        U.el("div", { class: "m4s-res-fiche-act" },
          U.el("button", { class: "m4s-btn m4s-btn--or", onclick: () => ouvrirModificationResident(r, rafraichir) }, "Modifier"))));

      const al = String(r.allergies || "").trim();
      if (al) detail.append(U.el("div", { class: "m4s-res-secu m4s-res-secu--danger" },
        U.el("span", { class: "m4s-res-secu__ic", html: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>' }),
        U.el("div", {}, U.el("div", { class: "m4s-res-secu__t" }, "Allergies — à respecter impérativement en cuisine"), U.el("div", { class: "m4s-res-secu__v" }, al))));
      else detail.append(U.el("div", { class: "m4s-res-secu m4s-res-secu--ok" },
        U.el("span", { class: "m4s-res-secu__ic", html: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' }),
        U.el("div", {}, U.el("div", { class: "m4s-res-secu__t" }, "Allergies"), U.el("div", { class: "m4s-res-secu__msg" }, "Aucune allergie signalée."))));

      const ligne = (lib, val) => U.el("div", { class: "m4s-res-ligne" }, U.el("span", { class: "m4s-res-ligne__lib" }, lib), U.el("span", { class: "m4s-res-ligne__val" }, val));
      const tuileTex = (l, c) => U.el("div", { class: "m4s-res-tuile" }, U.el("div", { class: "l" }, l), U.el("div", { class: "v " + (estMixe(c) ? "m" : "n") }, texLib(c)));
      const tuilePor = (l, n) => U.el("div", { class: "m4s-res-tuile" }, U.el("div", { class: "l" }, l), U.el("div", { class: "v p" }, (n != null && n !== "") ? String(n) : "—"));

      const blocRepas = U.el("div", { class: "m4s-res-bloc" }, U.el("div", { class: "m4s-res-bloc__tete" }, U.el("h3", {}, "Repas & régime")));
      const cRepas = U.el("div", { class: "m4s-res-bloc__corps" });
      cRepas.append(ligne("Texture générale", U.el("span", { html: badgeTexture(r.texture_code) })));
      cRepas.append(ligne("Régime", r.regime ? r.regime : U.el("span", { class: "m4s-res-vide-txt" }, "Aucun")));
      cRepas.append(U.el("div", { class: "m4s-res-sous" }, "Texture par plat"));
      cRepas.append(U.el("div", { class: "m4s-res-trio" }, tuileTex("Entrée", r.texture_entree), tuileTex("Plat", r.texture_plat), tuileTex("Dessert", r.texture_dessert)));

    rech.addEventListener("input", () => { ETAT.rechercheResidents = rech.value; renduListe(); });
    if (!ETAT.residentSelId) { const prem = listeFiltree()[0]; if (prem) ETAT.residentSelId = prem.id; }

  // [A1] Commande repas résidents — amorce
  /* ===== [C2] ACCUEIL TEMPORAIRE ======================================
     Deux blocs :
       1. Les SÉJOURS — qui est accueilli, dans quel groupe, sur quelle
          période, avec le détail des repas des jours d'arrivée/départ.
       2. Les FICHES des personnes en accueil temporaire — mêmes champs
          qu'un résident (textures, portions, régime, aversions…).
     Les résidents de l'accueil de jour figurent automatiquement parmi
     les personnes pouvant faire un séjour : ils sont souvent hébergés
     en internat dans les groupes 1 à 4.
     ==================================================================== */
  async function vueAccueilTemporaire(conteneur) {
    conteneur.innerHTML = "";
    conteneur.append(titrePage("Accueil temporaire",
      ETAT.semaineActive
        ? `Semaine S${ETAT.semaineActive.numero} · du ${U.dateFR(ETAT.semaineActive.dateDebut)} au ${U.dateFR(ETAT.semaineActive.dateFin)}`
        : "Séjours dans les groupes et fiches des personnes accueillies"));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));

    let sejours, personnes, fiches, groupes, textures, regimes, aversions, allergies, tousResidents;
    try {
      [sejours, personnes, fiches, groupes, textures, regimes, aversions, allergies, tousResidents] = await Promise.all([
        PERSISTANCE.chargerSejours(),
        PERSISTANCE.chargerPersonnesAT(),
        PERSISTANCE.chargerFichesAT(),
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerTextures(),
        PERSISTANCE.chargerReferentiels("regime"),
        PERSISTANCE.chargerReferentiels("aversion"),
        PERSISTANCE.chargerReferentiels("allergie"),
        PERSISTANCE.chargerResidentsPourCommande(),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Référentiels partagés avec le formulaire résident (réutilisé tel quel)
    ETAT.refs.groupes = groupes;
    ETAT.refs.textures = textures;
    ETAT.refs.regimes = regimes;
    ETAT.refs.aversions = aversions;
    ETAT.refs.allergies = allergies;

    // Groupes pouvant accueillir un séjour : les groupes de vie (G1..G4)
    // ET l'accueil de jour — une personne de l'extérieur peut très bien
    // être accueillie à l'ADJ. On écarte seulement le groupe technique
    // « AT » et les lieux de repas (Bar, Home cinéma…) du référentiel.
    const groupesAccueil = groupesHabites(groupes, tousResidents)
      .filter(g => g.code !== "AT");

    const rafraichir = () => vueAccueilTemporaire(conteneur);

    zone.innerHTML = "";

    /* ---------- Bloc 1 : les séjours ---------- */
    const auj = U.isoDate(new Date());
    const semaine = ETAT.semaineActive;
    if (!ETAT.filtreSejours) ETAT.filtreSejours = "semaine";

    // Classement de chaque séjour par rapport à aujourd'hui
    const periodeDe = s => (s.date_fin < auj) ? "passe"
                         : (s.date_debut <= auj) ? "encours" : "avenir";

    // Un séjour concerne la semaine affichée s'il la croise, même
    // partiellement — et même si cette semaine est passée.
    const dansLaSemaine = s => semaine
      && s.date_debut <= semaine.dateFin
      && s.date_fin >= semaine.dateDebut;

    const compteurs = { semaine: 0, avenir: 0, encours: 0, passe: 0 };
    sejours.forEach(s => {
      compteurs[periodeDe(s)]++;
      if (dansLaSemaine(s)) compteurs.semaine++;
    });

    const filtre = ETAT.filtreSejours;
    const visibles = sejours
      .filter(s => filtre === "tous" ? true
                 : filtre === "semaine" ? dansLaSemaine(s)
                 : periodeDe(s) === filtre)
      // semaine et « à venir » : du plus proche au plus lointain ; sinon du plus récent
      .sort((a, b) => (filtre === "avenir" || filtre === "semaine")
        ? a.date_debut.localeCompare(b.date_debut)
        : b.date_debut.localeCompare(a.date_debut));

    const carteSejours = U.el("div", { class: "m4s-carte" });

    const pastilleSejour = (code, libelle, nb) => U.el("button", {
      class: "m4s-filtre-btn" + (filtre === code ? " m4s-filtre-btn--actif" : ""),
      onclick: () => { ETAT.filtreSejours = code; rafraichir(); },
    }, nb == null ? libelle : `${libelle} (${nb})`);

    carteSejours.append(U.el("div", { class: "m4s-vue-titre" },
      U.el("h2", {}, "Séjours"),
      U.el("div", { class: "m4s-filtres" },
        pastilleSejour("semaine", semaine ? `Semaine S${semaine.numero}` : "Semaine", compteurs.semaine),
        pastilleSejour("avenir", "À venir", compteurs.avenir),
        pastilleSejour("encours", "En cours", compteurs.encours),
        pastilleSejour("passe", "Passés", compteurs.passe),
        pastilleSejour("tous", "Tous", sejours.length)),
      U.el("div", { class: "m4s-actions" },
        U.el("button", {
          class: "m4s-btn m4s-btn--or",
          onclick: () => ouvrirModaleSejours({ residentId: null, personnes, groupes: groupesAccueil, sejours, rafraichir }),
        }, "＋ Nouveau séjour")),
    ));

    const cadre = U.el("div", { class: "m4s-tableau-cadre" });
    const thead = U.el("thead", {}, U.el("tr", {},
      U.el("th", {}, "Personne"),
      U.el("th", {}, "Groupe d'accueil"),
      U.el("th", {}, "Période"),
      U.el("th", {}, "Arrivée"),
      U.el("th", {}, "Départ"),
      U.el("th", {}, "Déjeuner"),
      U.el("th", { style: "width:1%" }, "Actions"),
    ));
    const tbody = U.el("tbody");

    const auj2 = auj;
    visibles.forEach(s => {
      const p = s.residents || {};
      const etatPeriode = periodeDe(s);

      const nom = U.el("td", { style: "font-weight:500;white-space:nowrap" }, p.nom_prenom || "—");
      if (p.groupe_code === "ADJ") nom.append(" ", U.el("span", { class: "m4s-badge m4s-badge--at" }, "ADJ"));
      if (etatPeriode === "encours") nom.append(" ", U.el("span", { class: "m4s-badge m4s-badge--mixe" }, "en cours"));

      const repas = (midi, soir) => {
        const l = [];
        if (midi) l.push("midi");
        if (soir) l.push("soir");
        return l.length ? l.join(" + ") : "aucun repas";
      };

      tbody.append(U.el("tr", { style: etatPeriode === "passe" ? "opacity:.55" : null },
        nom,
        U.el("td", {}, U.el("span", { class: "m4s-badge m4s-badge--normal" }, s.groupe_code)),
        U.el("td", {}, `${U.dateFR(s.date_debut)} → ${U.dateFR(s.date_fin)}`),
        U.el("td", { class: "m4s-muet" }, repas(s.arrivee_midi, s.arrivee_soir)),
        U.el("td", { class: "m4s-muet" }, repas(s.depart_midi, s.depart_soir)),
        U.el("td", { class: "m4s-muet" }, s.lieu_midi === "adj" ? "en accueil de jour" : "dans le groupe"),
        U.el("td", { class: "m4s-td-actions" },
          U.el("button", {
            class: "m4s-btn m4s-btn--petit",
            title: "Ouvrir le planning complet de cette personne",
            onclick: () => ouvrirModaleSejours({
              residentId: s.resident_id, personnes, groupes: groupesAccueil, sejours, rafraichir,
            }),
          }, "Planning"),
          U.el("button", {
            class: "m4s-btn m4s-btn--petit m4s-btn--danger",
            onclick: async () => {
              if (!window.confirm(`Supprimer le séjour de « ${p.nom_prenom} » du ${U.dateFR(s.date_debut)} au ${U.dateFR(s.date_fin)} ?`)) return;
              try { await PERSISTANCE.supprimerSejour(s.id); toast("Séjour supprimé.", "succes"); await rafraichir(); }
              catch (e) { toast("Échec : " + e.message, "erreur", 6000); }
            },
          }, "Supprimer")),
      ));
    });

    cadre.append(U.el("table", { class: "m4s-tableau" }, thead, tbody));
    carteSejours.append(cadre);
    if (!visibles.length) carteSejours.append(U.el("p", { class: "m4s-placeholder" },
      !sejours.length ? "Aucun séjour enregistré."
        : filtre === "semaine" ? "Aucun accueil temporaire cette semaine-là."
        : "Aucun séjour dans cette période."));
    zone.append(carteSejours);

    /* ---------- Bloc 2 : les fiches des personnes en AT ---------- */
    const carteFiches = U.el("div", { class: "m4s-carte" });
    carteFiches.append(U.el("div", { class: "m4s-vue-titre" },
      U.el("h2", {}, "Personnes en accueil temporaire"),
      U.el("span", { class: "m4s-compteur" }, `${fiches.length} fiche(s)`),
      U.el("div", { class: "m4s-actions" },
        U.el("button", {
          class: "m4s-btn m4s-btn--or",
          onclick: () => ouvrirCreationPersonneAT(rafraichir, tousResidents.concat(fiches)),
        }, "＋ Nouvelle personne")),
    ));

    const cadre2 = U.el("div", { class: "m4s-tableau-cadre" });
    const thead2 = U.el("thead", {}, U.el("tr", {},
      ...["Nom Prénom", "Texture", "Service", "Régime", "Aversions", "Allergies", "Gastro.", "Actions"]
        .map(c => U.el("th", {}, c))));
    const tbody2 = U.el("tbody");

    fiches.forEach(r => {
      const mixe = String(r.texture_code || "").toUpperCase().startsWith("M");
      tbody2.append(U.el("tr", { class: mixe ? "m4s-ligne--mixe" : null },
        U.el("td", { style: "font-weight:500" }, r.nom_prenom || "—"),
        U.el("td", {}, U.el("span", { class: "m4s-badge " + (mixe ? "m4s-badge--mixe" : "m4s-badge--normal") }, mixe ? "Mixé" : "Normal")),
        U.el("td", {}, r.service_midi ? `${r.service_midi}ᵉ` : "—"),
        U.el("td", { class: "m4s-muet" }, r.regime || "—"),
        U.el("td", { class: "m4s-muet" }, r.aversions || "—"),
        U.el("td", { class: "m4s-muet" }, r.allergies || "—"),
        U.el("td", {}, r.gastrostomie ? "Oui" : "—"),
        U.el("td", { class: "m4s-td-actions" },
          U.el("button", {
            class: "m4s-btn m4s-btn--petit",
            onclick: () => ouvrirModificationResident(r, rafraichir),
          }, "Modifier"),
          U.el("button", {
            class: "m4s-btn m4s-btn--petit m4s-btn--danger",
            onclick: async () => {
              if (!window.confirm(`Désactiver « ${r.nom_prenom} » ?\n\nLa fiche sera masquée mais conservée (historique préservé).`)) return;
              try { await PERSISTANCE.desactiverResident(r.id); toast("Fiche désactivée.", "succes"); await rafraichir(); }
              catch (e) { toast("Échec : " + e.message, "erreur", 6000); }
            },
          }, "Désactiver")),
      ));
    });

    cadre2.append(U.el("table", { class: "m4s-tableau" }, thead2, tbody2));
    carteFiches.append(cadre2);
    if (!fiches.length) carteFiches.append(U.el("p", { class: "m4s-placeholder" }, "Aucune fiche d'accueil temporaire."));
    zone.append(carteFiches);
  }

  // Création d'une personne en accueil temporaire (même formulaire qu'un résident).
  // `existants` sert à détecter les doublons : une personne déjà connue
  // (notamment de l'accueil de jour) ne doit PAS avoir une seconde fiche —
  // il suffit de lui créer un séjour.
  function ouvrirCreationPersonneAT(rafraichir, existants = []) {
    const form = formulaireResident(null);
    modale({
      titre: "Nouvelle personne en accueil temporaire",
      corps: form.node,
      texteValider: "Créer",
      onValider: async () => {
        const objet = form.lire();

        // Comparaison souple : casse, accents et espaces multiples ignorés
        const normaliser = s => String(s || "").normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
        const jumeau = existants.find(r => normaliser(r.nom_prenom) === normaliser(objet.nom_prenom));
        if (jumeau) {
          const ou = jumeau.groupe_code === "ADJ" ? "en accueil de jour" : `dans le groupe ${jumeau.groupe_code}`;
          throw new Error(
            `« ${jumeau.nom_prenom} » existe déjà (${ou}). Ne créez pas de seconde fiche : ` +
            `fermez cette fenêtre et ajoutez-lui directement un séjour.`);
        }

        objet.actif = true;
        objet.type = "temporaire";   // distingue la fiche d'un résident permanent
        await PERSISTANCE.creerResident(objet);
        toast("Fiche créée. Programmez maintenant son séjour.", "succes", 5000);
        await rafraichir();
      },
    });
  }

  /**
   * Éditeur des séjours d'UNE personne.
   * Une ligne = un séjour : arrivée (date + repas midi/soir), départ
   * (date + repas midi/soir) et groupe d'accueil. Le bouton « Ajouter un
   * séjour » empile autant de lignes que nécessaire, ce qui permet de
   * programmer tout un planning connu à l'avance en une seule fois.
   * Les séjours déjà passés apparaissent grisés mais restent modifiables.
   */
  function ouvrirModaleSejours({ residentId, personnes, groupes, sejours, rafraichir }) {
    const auj = U.isoDate(new Date());

    // Personne concernée : figée si on édite un planning existant
    const cPersonne = selectListe(
      personnes.map(p => ({
        id: String(p.id),
        libelle: p.nom_prenom + (p.groupe_code === "ADJ" ? "  (accueil de jour)" : ""),
      })),
      residentId ? String(residentId) : "", "id", "libelle");
    if (residentId) { cPersonne.disabled = true; cPersonne.title = "Pour une autre personne, fermez et ouvrez son planning."; }

    const corpsLignes = U.el("div");
    const lignes = [];   // { donnees, node, lire(), estSupprimee }

    // La question du déjeuner ne concerne que les personnes de l'accueil
    // de jour hébergées dans un groupe (voir règle métier).
    const personneChoisie = () => personnes.find(x => String(x.id) === cPersonne.value);
    const vientDeLADJ = () => personneChoisie()?.groupe_code === "ADJ";

    /** Construit une ligne de séjour. `s` = séjour existant, ou null. */
    function ajouterLigne(s) {
      const passe = s && s.date_fin < auj;

      const cDebut = inputTexte(s?.date_debut || "", "date");
      const cFin   = inputTexte(s?.date_fin || "", "date");
      const bascule = v => { const c = U.el("input", { type: "checkbox" }); c.checked = !!v; return c; };
      const aMidi = bascule(s ? s.arrivee_midi : false);
      const aSoir = bascule(s ? s.arrivee_soir : true);
      const dMidi = bascule(s ? s.depart_midi : true);
      const dSoir = bascule(s ? s.depart_soir : false);
      const cGroupe = selectListe(groupes, s?.groupe_code || groupes[0]?.code, "code", "libelle");

      const cLieuMidi = selectListe(
        [{ code: "groupe", libelle: "Dans le groupe" }, { code: "adj", libelle: "En accueil de jour" }],
        s?.lieu_midi || "groupe", "code", "libelle");
      const blocLieu = U.el("div", { class: "m4s-sejour__champ" },
        U.el("label", {}, "Déjeuner"), cLieuMidi);

      const paireCases = (cM, cS) => U.el("div", { class: "m4s-sejour__cases" },
        U.el("label", { class: "m4s-check" }, cM, U.el("span", {}, "midi")),
        U.el("label", { class: "m4s-check" }, cS, U.el("span", {}, "soir")));

      const btnRetirer = U.el("button", {
        class: "m4s-btn m4s-btn--petit m4s-btn--danger", type: "button",
        title: "Retirer ce séjour",
        onclick: () => { ligne.estSupprimee = true; node.remove(); majEtatVide(); },
      }, "✕");

      const node = U.el("div", { class: "m4s-sejour" + (passe ? " m4s-sejour--passe" : "") },
        U.el("div", { class: "m4s-sejour__champ" }, U.el("label", {}, "Arrivée le"), cDebut),
        paireCases(aMidi, aSoir),
        U.el("div", { class: "m4s-sejour__champ" }, U.el("label", {}, "Départ le"), cFin),
        paireCases(dMidi, dSoir),
        U.el("div", { class: "m4s-sejour__champ" }, U.el("label", {}, "Groupe"), cGroupe),
        blocLieu,
        btnRetirer,
      );

      const ligne = {
        origine: s || null,
        node, estSupprimee: false,
        majDejeuner() {
          // masqué si la personne ne vient pas de l'ADJ, ou si elle y est accueillie
          const pertinent = vientDeLADJ() && cGroupe.value !== "ADJ";
          blocLieu.style.visibility = pertinent ? "" : "hidden";
          if (!pertinent) cLieuMidi.value = "groupe";
        },
        lire() {
          const debut = cDebut.value, fin = cFin.value;
          if (!debut || !fin) throw new Error("Chaque séjour doit avoir une date d'arrivée et une date de départ.");
          if (fin < debut) throw new Error(`Séjour du ${U.dateFR(debut)} : la date de départ précède la date d'arrivée.`);
          return {
            groupe_code: cGroupe.value,
            date_debut: debut, date_fin: fin,
            arrivee_midi: aMidi.checked, arrivee_soir: aSoir.checked,
            depart_midi: dMidi.checked, depart_soir: dSoir.checked,
            lieu_midi: cLieuMidi.value,
          };
        },
      };
      cGroupe.addEventListener("change", ligne.majDejeuner);
      ligne.majDejeuner();

      lignes.push(ligne);
      corpsLignes.append(node);
      majEtatVide();
      return ligne;
    }

    const messageVide = U.el("p", { class: "m4s-placeholder", style: "padding:20px" },
      "Aucun séjour. Utilisez « ＋ Ajouter un séjour ».");
    function majEtatVide() {
      const restantes = lignes.filter(l => !l.estSupprimee).length;
      messageVide.style.display = restantes ? "none" : "";
    }

    // Recharge les lignes quand on change de personne (en création)
    function chargerLignesDe(id) {
      lignes.length = 0;
      corpsLignes.innerHTML = "";
      const siennes = sejours
        .filter(s => String(s.resident_id) === String(id))
        .sort((a, b) => a.date_debut.localeCompare(b.date_debut));
      siennes.forEach(ajouterLigne);
      if (!siennes.length) ajouterLigne(null);
      lignes.forEach(l => l.majDejeuner());
    }
    cPersonne.addEventListener("change", () => chargerLignesDe(cPersonne.value));

    const btnAjouter = U.el("button", {
      class: "m4s-btn", type: "button", style: "margin-top:12px",
      onclick: () => ajouterLigne(null),
    }, "＋ Ajouter un séjour");

    const corps = U.el("div", {},
      U.el("div", { class: "m4s-champ" }, U.el("label", {}, "Personne accueillie"), cPersonne),
      U.el("div", { class: "m4s-sous-titre", style: "margin-top:18px" }, "Séjours"),
      corpsLignes, messageVide, btnAjouter,
    );

    chargerLignesDe(residentId || cPersonne.value);

    modale({
      titre: "Planning des séjours",
      corps,
      large: true,
      texteValider: "Enregistrer",
      onValider: async () => {
        const id = residentId || parseInt(cPersonne.value, 10);
        if (!id) throw new Error("Choisissez la personne accueillie.");

        // 1) Lecture + validation de toutes les lignes conservées
        const gardees = lignes.filter(l => !l.estSupprimee);
        const valeurs = gardees.map(l => ({ ligne: l, donnees: l.lire() }));

        // 2) Contrôle anti-doublon : aucun chevauchement entre les séjours
        //    de cette personne (elle ne peut pas être à deux endroits à la fois)
        const tries = [...valeurs].sort((a, b) => a.donnees.date_debut.localeCompare(b.donnees.date_debut));
        for (let i = 1; i < tries.length; i++) {
          if (tries[i].donnees.date_debut <= tries[i - 1].donnees.date_fin) {
            throw new Error(
              `Les séjours du ${U.dateFR(tries[i - 1].donnees.date_debut)} et du ` +
              `${U.dateFR(tries[i].donnees.date_debut)} se chevauchent.`);
          }
        }

        // 3) Écriture : suppressions, modifications, créations
        const aSupprimer = lignes.filter(l => l.estSupprimee && l.origine);
        for (const l of aSupprimer) await PERSISTANCE.supprimerSejour(l.origine.id);
        for (const v of valeurs) {
          if (v.ligne.origine) await PERSISTANCE.modifierSejour(v.ligne.origine.id, v.donnees);
          else await PERSISTANCE.creerSejour({ ...v.donnees, resident_id: id });
        }

        toast("Planning enregistré.", "succes");
        await rafraichir();
      },
    });
  }


  /* ===== [C] PAGES DE CONFIGURATION — référentiels simples ============
     Générateur unique réutilisé par « Animations », « Salles de repas »
     et « Textures, régimes, aversions ». Chaque liste a la même forme :
     libellé + abréviation, avec Modifier / Supprimer par ligne et un
     bouton Ajouter ouvrant une modale.
     Un seul générateur = aucune duplication (convention §8).
     ==================================================================== */

  /**
   * Affiche un tableau de référentiel éditable.
   * @param conteneur  élément où rendre le bloc
   * @param options    {
   *    titre, table, charger(), colonnes[], champs[],
   *    cleFiltre(ligne) → filtre PostgREST identifiant la ligne,
   *    valeursParDefaut  (objet ajouté à chaque création, ex. { categorie:'aversion' })
   * }
   */
  async function blocReferentiel(conteneur, options) {
    const bloc = U.el("div");
    conteneur.append(bloc);
    bloc.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));

    async function rafraichir() {
      let lignes;
      try { lignes = await options.charger(); }
      catch (e) {
        bloc.innerHTML = "";
        bloc.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
        return;
      }

      bloc.innerHTML = "";
      const carte = U.el("div", { class: "m4s-carte" });

      const btnAjouter = U.el("button", {
        class: "m4s-btn m4s-btn--or",
        onclick: () => ouvrirFormulaireReferentiel(null, options, rafraichir),
      }, "＋ Ajouter");

      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, options.titre),
        U.el("span", { class: "m4s-compteur" }, `${lignes.length} entrée(s)`),
        U.el("div", { class: "m4s-actions" }, btnAjouter),
      ));

      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const thead = U.el("thead", {}, U.el("tr", {},
        ...options.champs.map(c => U.el("th", {}, c.label)),
        U.el("th", { style: "width:1%" }, "Actions"),
      ));
      const tbody = U.el("tbody");

      lignes.forEach(ligne => {
        const inactive = options.desactivation && ligne.actif === false;
        const cellules = options.champs.map(c => {
          if (c.cle === "abreviation" || c.cle === "code") {
            return U.el("td", {}, U.el("span", { class: "m4s-badge m4s-badge--neutre" }, ligne[c.cle] ?? "—"));
          }
          return U.el("td", { style: inactive ? "font-weight:500;color:var(--texte-tres-doux)" : "font-weight:500" }, ligne[c.cle] ?? "—");
        });

        const modifier = U.el("button", {
          class: "m4s-btn m4s-btn--petit",
          onclick: () => ouvrirFormulaireReferentiel(ligne, options, rafraichir),
        }, "Modifier");

        // Mode DÉSACTIVATION (ex. Dotations) : l'entrée n'est jamais
        // supprimée — seulement masquée de la saisie courante — car
        // l'historique des semaines passées y fait référence.
        const actionFin = options.desactivation
          ? U.el("button", {
              class: "m4s-btn m4s-btn--petit" + (inactive ? "" : " m4s-btn--danger"),
              onclick: async () => {
                try {
                  await PERSISTANCE.modifierLigne(options.table, options.cleFiltre(ligne), { actif: inactive });
                  toast(inactive ? "Article réactivé." : "Article désactivé (historique conservé).", "succes");
                  await rafraichir();
                } catch (e) { toast("Échec : " + e.message, "erreur", 6000); }
              },
            }, inactive ? "Réactiver" : "Désactiver")
          : U.el("button", {
              class: "m4s-btn m4s-btn--petit m4s-btn--danger",
              onclick: async () => {
                const nom = ligne.libelle || ligne[options.champs[0].cle];
                if (!window.confirm(`Supprimer « ${nom} » ?\n\nCette action est définitive.`)) return;
                try {
                  await PERSISTANCE.supprimerLigne(options.table, options.cleFiltre(ligne));
                  toast("Entrée supprimée.", "succes");
                  await rafraichir();
                } catch (e) {
                  const msg = /foreign key|violates/i.test(e.message)
                    ? "Impossible : cette entrée est utilisée ailleurs dans l'application (résident, commande…). Modifiez-la plutôt que de la supprimer."
                    : e.message;
                  toast(msg, "erreur", 8000);
                }
              },
            }, "Supprimer");

        const tr = U.el("tr", { style: inactive ? "opacity:.55" : null }, ...cellules,
          U.el("td", { class: "m4s-td-actions" }, modifier, actionFin));
        if (inactive) tr.children[0].append(" ", U.el("span", { class: "m4s-badge m4s-badge--neutre" }, "désactivé"));
        tbody.append(tr);
      });

      cadre.append(U.el("table", { class: "m4s-tableau" }, thead, tbody));
      carte.append(cadre);
      if (!lignes.length) carte.append(U.el("p", { class: "m4s-placeholder" }, "Aucune entrée. Utilisez « ＋ Ajouter »."));
      bloc.append(carte);
    }

    await rafraichir();
  }

  // Modale de création / modification d'une entrée de référentiel
  function ouvrirFormulaireReferentiel(ligne, options, rafraichir) {
    const creation = !ligne;
    const controles = {};
    const grille = U.el("div", { class: "m4s-grille" });

    options.champs.forEach(c => {
      const input = inputTexte(ligne ? ligne[c.cle] : "", c.type || "text");
      // La clé primaire (code) ne se modifie pas : elle est référencée ailleurs
      if (!creation && c.cleFixe) { input.disabled = true; input.title = "Non modifiable : cette valeur est référencée ailleurs."; }
      controles[c.cle] = input;
      grille.append(champ(c.label + (c.obligatoire ? " *" : ""), input, c.plein !== false).bloc);
    });

    modale({
      titre: creation ? `Nouvelle entrée — ${options.titre}` : `Modifier — ${ligne.libelle || ""}`,
      corps: grille,
      texteValider: creation ? "Créer" : "Enregistrer",
      onValider: async () => {
        const objet = {};
        options.champs.forEach(c => {
          const v = String(controles[c.cle].value || "").trim();
          if (c.obligatoire && !v) throw new Error(`Le champ « ${c.label} » est obligatoire.`);
          // On n'envoie pas les champs figés en modification
          if (!creation && c.cleFixe) return;
          // Nombres envoyés comme de vrais nombres JSON (pas du texte),
          // indispensable pour les colonnes décimales (ex. prix).
          objet[c.cle] = c.type === "number" ? (v === "" ? null : Number(v)) : (v || null);
        });
        Object.assign(objet, options.valeursParDefaut || {});
        if (creation) await PERSISTANCE.creerLigne(options.table, objet);
        else await PERSISTANCE.modifierLigne(options.table, options.cleFiltre(ligne), objet);
        toast(creation ? "Entrée créée." : "Entrée modifiée.", "succes");
        await rafraichir();
      },
    });
  }

  // Titre de page réutilisable (hors carte)
  function titrePage(titre, sousTitre) {
    return U.el("div", { class: "m4s-page-titre" },
      U.el("div", {}, U.el("h1", {}, titre), sousTitre ? U.el("div", { class: "m4s-sous" }, sousTitre) : null));
  }

        valeursParDefaut: { categorie },
        champs: [

  /* ===== [A0] ANIMATIONS DE LA SEMAINE — paramétrage ==================
     Reproduit la 1re section de l'onglet ACCUEIL du classeur :
     pour chaque JOUR et chaque SERVICE, on déclare les repas animation
     organisés + le nombre de repas « personnel ».
     Ce paramétrage FILTRE ensuite les choix de la grille de commande.
     ==================================================================== */
  async function vueAnimationsSemaine(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Repas animations et spéciaux de la semaine"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let types, etat, groupes;
    try {
      [types, etat, groupes] = await Promise.all([
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerAnimationsSemaine(semaine),
        PERSISTANCE.chargerGroupes(),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Seules les animations sont programmables (les sorties/invitations
    // restent disponibles en permanence dans la grille).
    const animations = types.filter(t => (t.categorie || "") === "animation");
    const jours = U.joursDeLaSemaine(semaine);
    const SERVICES = [["midi", "MIDI"], ["soir", "SOIR"]];

    // Index : "jour|service" → [lignes programmées]
    function indexer(lignes) {
      const m = new Map();
      lignes.forEach(a => {
        const k = `${a.jour}|${a.service}`;
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(a);
      });
      return m;
    }
    let programme = indexer(etat.animations);

    // Recharge depuis la base après chaque modification
    async function recharger() {
      etat = await PERSISTANCE.chargerAnimationsSemaine(semaine);
      programme = indexer(etat.animations);
      dessiner();
    }

    function dessiner() {
      zone.innerHTML = "";

      zone.append(U.el("div", { class: "m4s-info" },
        U.el("span", {}, "💡"),
        U.el("span", {}, "Déclarez ici les animations organisées cette semaine. Seules celles-ci seront proposées dans la commande des repas résidents, pour le jour et le service concernés."),
      ));

      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, "Programme de la semaine"),
        U.el("span", { class: "m4s-compteur" }, `${etat.animations.length} animation(s) programmée(s)`),
      ));

      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const COULEURS = ["var(--lundi)", "var(--mardi)", "var(--mercredi)", "var(--jeudi)",
                        "var(--vendredi)", "var(--samedi)", "var(--dimanche)"];

      const trEntete = U.el("tr", {}, U.el("th", { style: "min-width:70px" }, "Service"));
      jours.forEach((j, i) => trEntete.append(
        U.el("th", { class: "m4s-th-jour", style: `border-bottom:2px solid ${COULEURS[i]};min-width:190px` },
          U.el("div", { class: "m4s-jour-nom", style: `color:${COULEURS[i]}` },
            `${j.nom.toUpperCase()} ${U.dateFR(j.date).slice(0, 5)}`))));

      const tbody = U.el("tbody");

      SERVICES.forEach(([service, libelleService]) => {
        const tr = U.el("tr", {}, U.el("td", { style: "font-weight:700;color:var(--texte-doux)" }, libelleService));

        jours.forEach(j => {
          const jourCle = j.nom.toLowerCase();
          const lignes = programme.get(`${jourCle}|${service}`) || [];
          const cellule = U.el("td", { style: "vertical-align:top" });
          const pile = U.el("div", { style: "display:flex;flex-direction:column;gap:6px" });

          // Animations déjà programmées : animation + lieu + encadrants.
          // Un clic sur la vignette rouvre la modale pour modifier.
          lignes.forEach(a => {
            const t = types.find(x => x.code === a.type_code);
            const lieu = groupes.find(g => g.code === a.lieu_code);

            const retirer = U.el("button", {
              class: "m4s-btn m4s-btn--petit", style: "padding:2px 7px",
              title: "Retirer cette animation", type: "button",
              onclick: async (e) => {
                e.stopPropagation();          // ne pas déclencher l'édition
                if (!window.confirm(`Retirer « ${t?.libelle || a.type_code} » de ce repas ?`)) return;
                try {
                  await PERSISTANCE.retirerAnimation({ semaineId: etat.semaineId, jour: jourCle, service, typeCode: a.type_code });
                  toast("Animation retirée.", "succes", 1400);
                  await recharger();
                } catch (e2) { toast("Échec : " + e2.message, "erreur", 6000); }
              },
            }, "✕");

            // Détail affiché : lieu + nombre d'encadrants
            const details = [];
            if (lieu) details.push(lieu.libelle);
            if (a.nb_repas_pers) details.push(`${a.nb_repas_pers} encadrant(s)`);

            const vignette = U.el("div", {
              class: "m4s-case m4s-case--animation",
              style: "display:flex;align-items:flex-start;gap:6px;text-align:left;padding:6px 8px;cursor:pointer",
              title: "Cliquer pour modifier",
              onclick: () => ouvrirModaleAnimation({
                semaine, jour: jourCle, service, animations, groupes,
                existante: a, dejaProgrammees: lignes.map(x => x.type_code), recharger,
              }),
            },
              U.el("div", { style: "flex:1;min-width:0" },
                U.el("div", {}, t?.libelle || a.type_code),
                details.length ? U.el("div", {
                  style: "font-weight:500;opacity:.8;font-size:10px;margin-top:2px",
                }, details.join(" · ")) : null),
              retirer);

            pile.append(vignette);
          });

          // Bouton d'ajout : ouvre la modale de saisie
          const dejaLa = lignes.map(a => a.type_code);
          const ajouter = U.el("button", {
            class: "m4s-filtre-btn", type: "button", style: "align-self:flex-start",
            onclick: () => ouvrirModaleAnimation({
              semaine, jour: jourCle, service, animations, groupes,
              existante: null, dejaProgrammees: dejaLa, recharger,
            }),
          }, "＋ Ajouter");

          pile.append(ajouter);
          cellule.append(pile);
          tr.append(cellule);
        });

        tbody.append(tr);
      });

      cadre.append(U.el("table", { class: "m4s-tableau" }, U.el("thead", {}, trEntete), tbody));
      carte.append(cadre);
      zone.append(carte);
    }

    dessiner();
  }

  // Place un menu sous son élément d'ancrage, en restant dans la fenêtre
  function positionnerMenu(menu, ancre) {
    const r = ancre.getBoundingClientRect();
    const l = menu.offsetWidth, h = menu.offsetHeight;
    let x = r.left, y = r.bottom + 4;
    if (x + l > window.innerWidth - 8) x = window.innerWidth - l - 8;
    if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 4);
    menu.style.left = `${Math.max(8, x)}px`;
    menu.style.top = `${y}px`;
  }

  /**
   * Modale de programmation d'un repas animation.
   * Trois informations, toutes issues des référentiels :
   *   • l'animation      → liste « Animations » (Configuration)
   *   • le lieu du repas → liste « Salles de repas / groupes »
   *   • le nombre d'encadrants prenant le repas
   * `existante` = ligne à modifier, ou null pour une création.
   */
  function ouvrirModaleAnimation({ semaine, jour, service, animations, groupes, existante, dejaProgrammees, recharger }) {
    const creation = !existante;

    // En création, on ne propose que les animations pas encore programmées
    // sur ce jour + ce service (une même animation n'y figure qu'une fois).
    const proposees = creation
      ? animations.filter(a => !dejaProgrammees.includes(a.code))
      : animations;

    if (creation && !proposees.length) {
      toast("Toutes les animations sont déjà programmées pour ce repas.", "info", 5000);
      return;
    }

    const cAnimation = selectListe(proposees, existante?.type_code, "code", "libelle");
    if (!creation) { cAnimation.disabled = true; cAnimation.title = "L'animation ne se change pas : retirez la ligne et ajoutez-en une autre."; }

    const cLieu = selectListe(
      [{ code: "", libelle: "— Non précisé —" }, ...groupes],
      existante?.lieu_code || "", "code", "libelle");

    const cEncadrants = inputTexte(existante?.nb_repas_pers ?? 0, "number");
    cEncadrants.min = "0";

    const jourLisible = jour.charAt(0).toUpperCase() + jour.slice(1);
    const corps = U.el("div", {},
      U.el("p", { class: "m4s-muet", style: "margin-bottom:16px" },
        `${jourLisible} ${service} · semaine ${semaine.numero}`),
      U.el("div", { class: "m4s-grille" },
        champ("Animation", cAnimation, true).bloc,
        champ("Lieu du repas", cLieu, true).bloc,
        champ("Nombre d'encadrants", cEncadrants, true).bloc,
      ),
    );

    modale({
      titre: creation ? "Programmer un repas animation" : "Modifier le repas animation",
      corps,
      texteValider: creation ? "Programmer" : "Enregistrer",
      onValider: async () => {
        const code = creation ? cAnimation.value : existante.type_code;
        if (!code) throw new Error("Choisissez une animation.");
        await PERSISTANCE.programmerAnimation({
          semaine, jour, service, typeCode: code,
          lieuCode: cLieu.value || null,
          nbRepasPers: parseInt(cEncadrants.value, 10) || 0,
        });
        toast(creation ? "Animation programmée." : "Animation mise à jour.", "succes");
        await recharger();
      },
    });
  }

  /* ===== [A3] COMMANDE REPAS FAMILLE =================================
     Nombre de repas pris par la famille d'un résident, par jour et service.
     Structure identique à la commande résidents (résidents en lignes,
     triés par groupe, filtres, bandes colorées) mais avec saisie de
     QUANTITÉS et une ligne de totaux (comme la commande encadrants).
     ==================================================================== */
  async function vueCommandeFamilles(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Commande — Repas famille"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let residents, groupes, etat;
    try {
      [groupes, residents, etat] = await Promise.all([
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerCommandesFamilles(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Index des quantités : "residentId|jour|service" → nombre
    const index = new Map();
    etat.lignes.forEach(l => index.set(`${l.resident_id}|${l.jour}|${l.service}`, l.nombre));

    // Tri par groupe puis nom (comme la grille résidents)
    const rang = {}; groupes.forEach(g => { rang[g.code] = g.ordre ?? 99; });
    residents.sort((a, b) => {
      const ra = rang[a.groupe_code] ?? 99, rb = rang[b.groupe_code] ?? 99;
      if (ra !== rb) return ra - rb;
      return String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr");
    });

    const jours = U.joursDeLaSemaine(semaine);
    const SERVICES = ["midi", "soir"];
    const COULEURS_JOUR = ["var(--lundi)", "var(--mardi)", "var(--mercredi)", "var(--jeudi)",
                           "var(--vendredi)", "var(--samedi)", "var(--dimanche)"];

    function dessiner() {
      const filtre = ETAT.filtreGroupeFamilles || "TOUS";
      const recherche = (ETAT.rechercheFamilles || "").trim().toLowerCase();
      let liste = (filtre === "TOUS") ? residents : residents.filter(r => (r.groupe_code || "") === filtre);
      if (recherche) liste = liste.filter(r => String(r.nom_prenom || "").toLowerCase().includes(recherche));

      zone.innerHTML = "";

      zone.append(U.el("div", { class: "m4s-info" },
        U.el("span", {}, "💡"),
        U.el("span", {}, "Saisissez le nombre de repas pris par la famille de chaque résident. Une case vide = aucun repas famille."),
      ));

      // Pastilles de groupe (uniquement les groupes habités)
      const barre = U.el("div", { class: "m4s-filtres", style: "margin-bottom:16px" });
      const pastille = (code, libelle) => U.el("button", {
        class: "m4s-filtre-btn" + (filtre === code ? " m4s-filtre-btn--actif" : ""),
        onclick: () => { ETAT.filtreGroupeFamilles = code; dessiner(); },
      }, libelle);
      barre.append(pastille("TOUS", "Tous"));
      groupesHabites(groupes, residents).filter(g => g.code !== "AT")
        .forEach(g => barre.append(pastille(g.code, g.libelle || g.code)));
      zone.append(barre);

      const carte = U.el("div", { class: "m4s-carte" });

      const champRecherche = U.el("input", { class: "m4s-recherche", type: "search", placeholder: "Rechercher…", value: ETAT.rechercheFamilles || "" });
      champRecherche.addEventListener("input", () => {
        ETAT.rechercheFamilles = champRecherche.value;
        const pos = champRecherche.selectionStart;
        dessiner();
        const n = zone.querySelector(".m4s-recherche");
        if (n) { n.focus(); n.setSelectionRange(pos, pos); }
      });

      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, `Repas famille — ${liste.length} résident(s)`),
        U.el("div", { class: "m4s-actions" }, champRecherche),
      ));

      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const trE = U.el("tr", {}, U.el("th", { style: "min-width:200px" }, "Résident"), U.el("th", {}, "Groupe"));
      jours.forEach((j, i) => trE.append(
        U.el("th", { class: "m4s-th-jour", colspan: 2,
          style: `border-bottom:2px solid ${COULEURS_JOUR[i]};border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[i]} 60%, transparent);background:color-mix(in srgb, ${COULEURS_JOUR[i]} 20%, var(--fond))` },
          U.el("div", { class: "m4s-jour-nom", style: `color:${COULEURS_JOUR[i]}` }, `${j.nom.toUpperCase()} ${U.dateFR(j.date).slice(0, 5)}`),
          U.el("div", { class: "m4s-services" }, U.el("span", {}, "MIDI"), U.el("span", {}, "SOIR")))));
      const tbody = U.el("tbody");

      // Totaux (sur la liste affichée)
      const champsTotal = {};
      const majTotal = (jour, service) => {
        let s = 0;
        liste.forEach(r => { s += index.get(`${r.id}|${jour}|${service}`) || 0; });
        if (champsTotal[`${jour}|${service}`]) champsTotal[`${jour}|${service}`].textContent = s || "";
      };

      liste.forEach((r, idxLigne) => {
        const tdNom = U.el("td", { style: "font-weight:500;white-space:nowrap" }, r.nom_prenom || "—");
        if (r.type === "temporaire") tdNom.append(" ", U.el("span", { class: "m4s-badge m4s-badge--at" }, "AT"));
        const tr = U.el("tr", {}, tdNom, U.el("td", {}, r.groupe_code || "—"));

        jours.forEach((j, iJour) => {
          const jourCle = j.nom.toLowerCase();
          const teinte = `color-mix(in srgb, ${COULEURS_JOUR[iJour]} ${idxLigne % 2 ? 18 : 9}%, white)`;
          SERVICES.forEach((service, iServ) => {
            const cle = `${r.id}|${jourCle}|${service}`;
            const val = index.get(cle) || "";
            const input = U.el("input", { class: "m4s-input m4s-case-nb", type: "number", min: "0", value: val, inputmode: "numeric" });
            input.addEventListener("change", async () => {
              const n = parseInt(input.value, 10) || 0;
              input.value = n || "";
              input.disabled = true;
              try {
                await PERSISTANCE.enregistrerFamille({ semaine, residentId: r.id, jour: jourCle, service, nombre: n });
                if (n > 0) index.set(cle, n); else index.delete(cle);
                majTotal(jourCle, service);
                toast("Enregistré.", "succes", 1000);
              } catch (e) {
                input.value = val;
                toast("Échec : " + e.message, "erreur", 6000);
              } finally { input.disabled = false; }
            });
            const style = `background:${teinte}` + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "");
            tr.append(U.el("td", { class: "m4s-td-case", style }, input));
          });
        });
        tbody.append(tr);
      });

      // Ligne de totaux
      const trT = U.el("tr", { class: "m4s-ligne-total" },
        U.el("td", { style: "font-weight:800" }, "Total familles"), U.el("td", {}));
      jours.forEach((j, iJour) => {
        const jourCle = j.nom.toLowerCase();
        SERVICES.forEach((service, iServ) => {
          const cell = U.el("td", { class: "m4s-td-case", style: "text-align:center;font-weight:800" + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "") });
          champsTotal[`${jourCle}|${service}`] = cell;
          trT.append(cell);
        });
      });
      tbody.append(trT);

      cadre.append(U.el("table", { class: "m4s-tableau m4s-tableau--encadrants" }, U.el("thead", {}, trE), tbody));
      carte.append(cadre);
      if (!liste.length) carte.append(U.el("p", { class: "m4s-placeholder" }, "Aucun résident ne correspond."));
      zone.append(carte);

      jours.forEach(j => SERVICES.forEach(s => majTotal(j.nom.toLowerCase(), s)));
    }

    dessiner();
  }

  // Correspondance jour complet → code 3 lettres des colonnes dotations_semaine
  /* ===== [A4] DOTATIONS — panier de commande fournisseur =============
     Catalogue interne (désignation, fournisseur, référence, prix, unité)
     et saisie d'UNE quantité par article pour la semaine sélectionnée —
     on commande pour l'établissement, pas par groupe ni par jour.
     Aucune connexion aux sites fournisseurs : la liste obtenue se
     ressaisit manuellement ou s'imprime.
     ==================================================================== */
  async function vueDotations(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Dotations — commande fournisseur"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let articles, etat, historique, groupes, residents, commandesPassees;
    try {
      [articles, etat, historique, groupes, residents, commandesPassees] = await Promise.all([
        PERSISTANCE.chargerDotations(),
        PERSISTANCE.chargerCommandeDotations(semaine),
        PERSISTANCE.chargerHistoriqueDotations(),
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerCommandesPassees(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }
    const groupesChoix = groupesHabites(groupes, residents).filter(g => g.code !== "AT");

    // Index modifiable : dotationId → quantité commandée cette semaine
    const index = new Map();
    articles.forEach(a => index.set(a.id, 0));
    etat.lignes.forEach(l => index.set(l.dotation_id, l.quantite));

    const parCategorie = {};
    articles.forEach(a => { (parCategorie[a.categorie] ||= []).push(a); });

    // Bandeau récapitulatif : nombre de lignes commandées + total (si prix connus)
    const recap = U.el("div", { class: "m4s-info", style: "align-items:center" });
    const btnPasserCommande = U.el("button", {
      class: "m4s-btn m4s-btn--or", style: "margin-left:auto",
      onclick: () => ouvrirModalePasserCommande({ semaine, groupes: groupesChoix, index, articles, rafraichir: () => vueDotations(conteneur, module) }),
    }, "📨 Passer la commande");
    function majRecap() {
      let lignes = 0, total = 0, sansPrix = 0;
      articles.forEach(a => {
        const q = index.get(a.id) || 0;
        if (q > 0) {
          lignes++;
          if (a.prix != null) total += a.prix * q; else sansPrix++;
        }
      });
      recap.innerHTML = "";
      recap.append(U.el("span", {}, "🛒"),
        U.el("span", {}, lignes ? `${lignes} article(s) commandé(s)` : "Panier vide pour cette semaine."),
        (lignes && total > 0) ? U.el("span", { style: "font-weight:800" },
          `Total estimé : ${total.toFixed(2)} €HT${sansPrix ? ` (+${sansPrix} sans prix connu)` : ""}`) : null,
        btnPasserCommande);
    }

    function ligneArticle(a, idxLigne) {
      const q = index.get(a.id) || 0;
      const dern = historique.get(a.id);

      const decrementer = U.el("button", { class: "m4s-btn m4s-btn--petit", type: "button", title: "Retirer une unité" }, "−");
      const champ = U.el("input", { class: "m4s-input m4s-case-nb", type: "number", min: "0", value: q || "", inputmode: "numeric", style: "width:64px" });
      const incrementer = U.el("button", { class: "m4s-btn m4s-btn--petit", type: "button", title: "Ajouter une unité" }, "+");

      const totalLigne = U.el("span", { class: "m4s-muet", style: "min-width:78px;display:inline-block;text-align:right" });
      const majAffichage = () => {
        const n = index.get(a.id) || 0;
        totalLigne.textContent = (a.prix != null && n > 0) ? `${(a.prix * n).toFixed(2)} €HT` : "";
      };
      majAffichage();

      async function enregistrer(nouvelleValeur) {
        const n = Math.max(0, parseInt(nouvelleValeur, 10) || 0);
        const precedente = index.get(a.id) || 0;
        champ.value = n || "";
        index.set(a.id, n);
        majAffichage(); majRecap();
        champ.disabled = decrementer.disabled = incrementer.disabled = true;
        try {
          await PERSISTANCE.enregistrerCommandeDotation({ semaine, dotationId: a.id, quantite: n });
        } catch (e) {
          index.set(a.id, precedente);
          champ.value = precedente || "";
          majAffichage(); majRecap();
          toast("Échec : " + e.message, "erreur", 6000);
        } finally {
          champ.disabled = decrementer.disabled = incrementer.disabled = false;
        }
      }

      decrementer.addEventListener("click", () => enregistrer((index.get(a.id) || 0) - 1));
      incrementer.addEventListener("click", () => enregistrer((index.get(a.id) || 0) + 1));
      champ.addEventListener("change", () => enregistrer(champ.value));

      const infos = U.el("div", { style: "font-size:11px;color:var(--texte-tres-doux);margin-top:2px" },
        [a.fournisseur, a.reference ? `réf. ${a.reference}` : null].filter(Boolean).join(" · ") || null,
        dern ? U.el("span", {}, `${a.fournisseur || a.reference ? " — " : ""}dernière commande : S${dern.numero} (${dern.quantite})`) : null,
      );

      return U.el("div", {
        class: "m4s-ligne-dotation" + (idxLigne % 2 ? " m4s-ligne-dotation--alt" : ""),
      },
        U.el("div", { style: "flex:1;min-width:0" },
          U.el("div", { style: "font-weight:600" }, a.designation),
          infos,
        ),
        U.el("div", { class: "m4s-muet", style: "min-width:90px" }, a.unite || "—"),
        U.el("div", { class: "m4s-muet", style: "min-width:70px" }, a.prix != null ? `${a.prix.toFixed(2)} €HT` : "—"),
        U.el("div", { style: "display:flex;align-items:center;gap:6px" }, decrementer, champ, incrementer),
        totalLigne,
      );
    }

    zone.innerHTML = "";
    zone.append(recap);
    majRecap();

    Object.entries(parCategorie).forEach(([categorie, items]) => {
      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, categorie),
        U.el("span", { class: "m4s-compteur" }, `${items.length} article(s)`),
      ));
      const corps = U.el("div", { style: "padding:4px 20px 12px" });
      items.forEach((a, i) => corps.append(ligneArticle(a, i)));
      carte.append(corps);
      zone.append(carte);
    });

    if (!articles.length) zone.append(U.el("div", { class: "m4s-carte" },
      U.el("p", { class: "m4s-placeholder" }, "Aucun article. Ajoutez-en depuis Configuration → Dotations.")));

    // --- Historique : commandes déjà passées sur cette semaine ---
    if (commandesPassees.length) {
      const carteHisto = U.el("div", { class: "m4s-carte" });
      carteHisto.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, "Commandes passées cette semaine"),
        U.el("span", { class: "m4s-compteur" }, `${commandesPassees.length} envoi(s)`),
      ));
      const cadreH = U.el("div", { class: "m4s-tableau-cadre" });
      const theadH = U.el("thead", {}, U.el("tr", {},
        U.el("th", {}, "Date"), U.el("th", {}, "Groupe"), U.el("th", {}, "Passée par"),
        U.el("th", {}, "Livraison souhaitée"), U.el("th", {}, "Contenu"), U.el("th", { style: "width:1%" }, "Actions")));
      const tbodyH = U.el("tbody");
      commandesPassees.forEach(c => {
        const g = groupesChoix.find(x => x.code === c.groupe_code);
        const dt = new Date(c.date_commande);
        const heure = isNaN(dt) ? "" : ` à ${String(dt.getHours()).padStart(2, "0")}h${String(dt.getMinutes()).padStart(2, "0")}`;
        const lignesTicket = c.commandes_dotations_lignes || [];
        const nbRupture = lignesTicket.filter(l => l.rupture).length;
        const nbActives = lignesTicket.length - nbRupture;

        tbodyH.append(U.el("tr", {},
          U.el("td", {}, U.dateFR(c.date_commande.slice(0, 10)) + heure),
          U.el("td", {}, g?.libelle || c.groupe_code || "—"),
          U.el("td", {}, c.passee_par),
          U.el("td", {}, c.date_livraison ? U.dateFR(c.date_livraison) : "—"),
          U.el("td", { class: "m4s-muet" },
            `${nbActives} article(s)` + (nbRupture ? ` · ${nbRupture} en rupture` : "")),
          U.el("td", { class: "m4s-td-actions" },
            U.el("button", {
              class: "m4s-btn m4s-btn--petit",
              onclick: () => ouvrirDetailCommandePassee(c, () => vueDotations(conteneur, module)),
            }, "Récupérer")),
        ));
      });
      cadreH.append(U.el("table", { class: "m4s-tableau" }, theadH, tbodyH));
      carteHisto.append(cadreH);
      zone.append(carteHisto);
    }
  }

  /**
   * Détail d'une commande figée : liste des lignes, possibilité de
   * marquer un article en rupture (retiré par la cuisine, avec trace de
   * qui et quand), et récupération de la liste en CSV pour l'envoyer
   * au fournisseur (impression, e-mail…) — aucune connexion externe.
   */
  async function ouvrirDetailCommandePassee(entete, rafraichir) {
    let lignes;
    try { lignes = await PERSISTANCE.chargerLignesCommande(entete.id); }
    catch (e) { toast("Impossible de charger le détail : " + e.message, "erreur", 6000); return; }

    const corps = U.el("div");
    const cadre = U.el("div", { class: "m4s-tableau-cadre" });
    const thead = U.el("thead", {}, U.el("tr", {},
      U.el("th", {}, "Désignation"), U.el("th", {}, "Fournisseur"), U.el("th", {}, "Réf."),
      U.el("th", {}, "Unité"), U.el("th", { style: "text-align:right" }, "Qté"),
      U.el("th", { style: "text-align:right" }, "Prix HT"), U.el("th", { style: "width:1%" }, "")));
    const tbody = U.el("tbody");

    lignes.forEach(l => {
      const tr = U.el("tr", { style: l.rupture ? "opacity:.5;text-decoration:line-through" : null },
        U.el("td", { style: "font-weight:500" }, l.designation),
        U.el("td", { class: "m4s-muet" }, l.fournisseur || "—"),
        U.el("td", { class: "m4s-muet" }, l.reference || "—"),
        U.el("td", { class: "m4s-muet" }, l.unite || "—"),
        U.el("td", { style: "text-align:right" }, l.quantite),
        U.el("td", { style: "text-align:right" }, l.prix != null ? `${l.prix.toFixed(2)} €` : "—"),
      );
      const btn = U.el("button", {
        class: "m4s-btn m4s-btn--petit" + (l.rupture ? "" : " m4s-btn--danger"),
        title: l.rupture
          ? `Réintégré possible (retiré le ${U.dateFR((l.rupture_le || "").slice(0, 10))} par ${l.rupture_par || "?"})`
          : "Retirer cet article (rupture de stock fournisseur)",
        onclick: async () => {
          try {
            await PERSISTANCE.marquerRuptureLigne(l.id, !l.rupture);
            toast(l.rupture ? "Article réintégré." : "Article marqué en rupture.", "succes");
            document.querySelectorAll(".m4s-modale-fond").forEach(n => n.remove());
            await ouvrirDetailCommandePassee(entete, rafraichir);
            await rafraichir();
          } catch (e) { toast("Échec : " + e.message, "erreur", 6000); }
        },
      }, l.rupture ? "Réintégrer" : "Rupture");
      tr.append(U.el("td", {}, btn));
      tbody.append(tr);
    });

    cadre.append(U.el("table", { class: "m4s-tableau" }, thead, tbody));
    corps.append(
      U.el("p", { class: "m4s-muet", style: "margin-bottom:14px" },
        `Commande passée le ${U.dateFR(entete.date_commande.slice(0, 10))} par ${entete.passee_par}` +
        (entete.date_livraison ? ` · livraison souhaitée le ${U.dateFR(entete.date_livraison)}` : "")),
      cadre,
    );

    modale({
      titre: "Détail de la commande",
      corps,
      large: true,
      texteValider: "⬇ Télécharger (CSV)",
      onValider: () => { telechargerCSVCommande(entete, lignes); },
    });
  }

  // Génère un fichier CSV téléchargeable de la commande — pour l'envoyer
  // au fournisseur (pièce jointe, impression…). Exclut les ruptures.
  function telechargerCSVCommande(entete, lignes) {
    const utiles = lignes.filter(l => !l.rupture);
    const echapper = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const entetesCSV = ["Désignation", "Fournisseur", "Référence", "Unité", "Quantité", "Prix unitaire HT", "Total HT"];
    const lignesCSV = utiles.map(l => [
      l.designation, l.fournisseur || "", l.reference || "", l.unite || "", l.quantite,
      l.prix != null ? l.prix.toFixed(2) : "", l.prix != null ? (l.prix * l.quantite).toFixed(2) : "",
    ]);
    const csv = [entetesCSV, ...lignesCSV].map(r => r.map(echapper).join(";")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = U.el("a", { href: url, download: `commande-dotations-${entete.date_commande.slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("Fichier téléchargé.", "succes");
  }

  /**
   * Modale « Passer la commande » : trace l'envoi de la commande, sans
   * geler le panier (qui reste modifiable ensuite si besoin).
   */
  function ouvrirModalePasserCommande({ semaine, groupes, index, articles, rafraichir }) {
    const nbLignes = articles.filter(a => (index.get(a.id) || 0) > 0).length;
    if (!nbLignes) { toast("Le panier est vide : renseignez au moins un article avant de passer la commande.", "erreur", 5000); return; }

    const cGroupe = selectListe(groupes, groupes[0]?.code, "code", "libelle");
    const cPassePar = inputTexte(ETAT.utilisateur?.email || "", "text");
    const cLivraison = inputTexte("", "date");

    const corps = U.el("div", {},
      U.el("p", { class: "m4s-muet", style: "margin-bottom:16px" },
        `${nbLignes} article(s) dans le panier de la semaine S${semaine.numero}.`),
      U.el("div", { class: "m4s-grille" },
        champ("Groupe", cGroupe, true).bloc,
        champ("Commande passée par", cPassePar, true).bloc,
        champ("Date de livraison souhaitée", cLivraison, true).bloc,
      ),
    );

    modale({
      titre: "Passer la commande",
      corps,
      texteValider: "Confirmer l'envoi",
      onValider: async () => {
        const passeePar = cPassePar.value.trim();
        if (!passeePar) throw new Error("Précisez qui passe la commande.");
        if (!cLivraison.value) throw new Error("Précisez la date de livraison souhaitée.");
        await PERSISTANCE.passerCommandeDotations({
          semaine, groupeCode: cGroupe.value, passeePar, dateLivraison: cLivraison.value,
          lignes: articles.filter(a => (index.get(a.id) || 0) > 0).map(a => ({
            dotationId: a.id, designation: a.designation, fournisseur: a.fournisseur,
            reference: a.reference, unite: a.unite, prix: a.prix, quantite: index.get(a.id),
          })),
        });
        toast("Commande enregistrée.", "succes");
        await rafraichir();
      },
    });
  }

  /* ===== [A2] COMMANDE REPAS ENCADRANTS ==============================
     Saisie de QUANTITÉS (et non de statuts) : pour un groupe donné, on
     compte les repas par catégorie de personnel, jour et service.
     Disposition compacte avec sélecteur de groupe (comme les résidents) :
     catégories en lignes, 7 jours × midi/soir en colonnes, + une ligne
     de totaux calculés automatiquement.
     ==================================================================== */
  async function vueCommandeEncadrants(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Commande — Repas encadrants"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let categories, groupes, etat, residents;
    try {
      [categories, groupes, etat, residents] = await Promise.all([
        PERSISTANCE.chargerCategoriesEncadrants(),
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerCommandesEncadrants(semaine),
        PERSISTANCE.chargerResidentsPourCommande(),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Groupes concernés : ceux qui accueillent des résidents (G1..G4, ADJ)
    const groupesSaisie = groupesHabites(groupes, residents).filter(g => g.code !== "AT");
    if (!ETAT.groupeEncadrants || !groupesSaisie.some(g => g.code === ETAT.groupeEncadrants)) {
      ETAT.groupeEncadrants = groupesSaisie[0]?.code || null;
    }

    // Index des quantités : "groupe|categorie|jour|service" → nombre
    const index = new Map();
    etat.lignes.forEach(l => index.set(`${l.groupe_code}|${l.categorie_id}|${l.jour}|${l.service}`, l.nombre));

    const jours = U.joursDeLaSemaine(semaine);
    const SERVICES = ["midi", "soir"];
    const COULEURS_JOUR = ["var(--lundi)", "var(--mardi)", "var(--mercredi)", "var(--jeudi)",
                           "var(--vendredi)", "var(--samedi)", "var(--dimanche)"];

    function dessiner() {
      const groupe = ETAT.groupeEncadrants;
      zone.innerHTML = "";

      // --- Pastilles de groupe ---
      const barre = U.el("div", { class: "m4s-filtres", style: "margin-bottom:16px" });
      groupesSaisie.forEach(g => barre.append(U.el("button", {
        class: "m4s-filtre-btn" + (groupe === g.code ? " m4s-filtre-btn--actif" : ""),
        onclick: () => { ETAT.groupeEncadrants = g.code; dessiner(); },
      }, g.libelle || g.code)));
      zone.append(barre);

      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, `Repas encadrants — ${groupe}`),
        U.el("span", { class: "m4s-compteur" }, `${categories.length} catégorie(s)`),
      ));

      const cadre = U.el("div", { class: "m4s-tableau-cadre" });

      // En-tête : catégorie + jours (midi/soir)
      const trE = U.el("tr", {}, U.el("th", { style: "min-width:170px" }, "Personnel"));
      jours.forEach((j, i) => trE.append(
        U.el("th", { class: "m4s-th-jour", colspan: 2,
          style: `border-bottom:2px solid ${COULEURS_JOUR[i]};border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[i]} 60%, transparent);background:color-mix(in srgb, ${COULEURS_JOUR[i]} 20%, var(--fond))` },
          U.el("div", { class: "m4s-jour-nom", style: `color:${COULEURS_JOUR[i]}` }, `${j.nom.toUpperCase()} ${U.dateFR(j.date).slice(0, 5)}`),
          U.el("div", { class: "m4s-services" }, U.el("span", {}, "MIDI"), U.el("span", {}, "SOIR")))));
      const tbody = U.el("tbody");

      // Cases de saisie (petits champs numériques). Les totaux se recalculent
      // à la volée sans requête réseau.
      const champsTotal = {};   // "jour|service" → cellule de total
      const majTotal = (jour, service) => {
        let s = 0;
        categories.forEach(c => { s += index.get(`${groupe}|${c.id}|${jour}|${service}`) || 0; });
        if (champsTotal[`${jour}|${service}`]) champsTotal[`${jour}|${service}`].textContent = s || "";
      };

      categories.forEach((c, idxLigne) => {
        const tr = U.el("tr", {}, U.el("td", { style: "font-weight:500" }, c.libelle));
        jours.forEach((j, iJour) => {
          const jourCle = j.nom.toLowerCase();
          const teinte = `color-mix(in srgb, ${COULEURS_JOUR[iJour]} ${idxLigne % 2 ? 22 : 12}%, white)`;
          SERVICES.forEach((service, iServ) => {
            // [ADJ] Pas de soir pour l'accueil de jour → case neutre non saisissable
            if (!serviceApplicable(groupe, service)) {
              tr.append(U.el("td", { class: "m4s-td-case", style: `background:${teinte}` +
                (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "") }, caseNonApplicable()));
              return;
            }
            const cle = `${groupe}|${c.id}|${jourCle}|${service}`;
            const val = index.get(cle) || "";
            const input = U.el("input", {
              class: "m4s-input m4s-case-nb", type: "number", min: "0", value: val,
              inputmode: "numeric",
            });
            input.addEventListener("change", async () => {
              const n = parseInt(input.value, 10) || 0;
              input.value = n || "";
              input.disabled = true;
              try {
                await PERSISTANCE.enregistrerEncadrant({ semaine, groupeCode: groupe, categorieId: c.id, jour: jourCle, service, nombre: n });
                if (n > 0) index.set(cle, n); else index.delete(cle);
                majTotal(jourCle, service);
                toast("Enregistré.", "succes", 1000);
              } catch (e) {
                input.value = val;
                toast("Échec : " + e.message, "erreur", 6000);
              } finally { input.disabled = false; }
            });
            const style = `background:${teinte}` + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "");
            tr.append(U.el("td", { class: "m4s-td-case", style }, input));
          });
        });
        tbody.append(tr);
      });

      // Ligne de totaux
      const trT = U.el("tr", { class: "m4s-ligne-total" }, U.el("td", { style: "font-weight:800" }, "Total encadrants"));
      jours.forEach((j, iJour) => {
        const jourCle = j.nom.toLowerCase();
        SERVICES.forEach((service, iServ) => {
          const cell = U.el("td", { class: "m4s-td-case", style: "text-align:center;font-weight:800" + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "") });
          if (serviceApplicable(groupe, service)) champsTotal[`${jourCle}|${service}`] = cell;
          else cell.textContent = "—";   // [ADJ] total non applicable
          trT.append(cell);
        });
      });
      tbody.append(trT);

      cadre.append(U.el("table", { class: "m4s-tableau m4s-tableau--encadrants" }, U.el("thead", {}, trE), tbody));
      carte.append(cadre);
      zone.append(carte);

      // Calcul initial des totaux
      jours.forEach(j => SERVICES.forEach(s => majTotal(j.nom.toLowerCase(), s)));
    }

    dessiner();
  }

  /* ===== [B2] REPAS ANIMATION — document imprimable ====================
     Reproduit l'onglet REPAS ANIM du classeur : pour chaque animation
     programmée dans la semaine (voir « Animations de la semaine »), la
     liste des résidents INSCRITS — tous groupes confondus, puisqu'une
     animation rassemble des résidents de plusieurs groupes — avec leurs
     aversions/allergies (utile en cuisine), suivie des compteurs :
     encadrants, dont mixé/normal, total présents. Lecture seule.
     ==================================================================== */
  async function vueRepasAnimation(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Repas animation"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
      U.el("div", { class: "m4s-actions m4s-no-print" },
        U.el("button", { class: "m4s-btn m4s-btn--or", onclick: () => window.print() }, "🖨 Imprimer")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let etatAnim, types, groupes, residents, etatCmd;
    try {
      [etatAnim, types, groupes, residents, etatCmd] = await Promise.all([
        PERSISTANCE.chargerAnimationsSemaine(semaine),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerCommandes(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    const libelleType = {}; types.forEach(t => { libelleType[t.code] = t.libelle; });
    const libelleGroupe = {}; groupes.forEach(g => { libelleGroupe[g.code] = g.libelle || g.code; });
    const residentParId = {}; residents.forEach(r => { residentParId[r.id] = r; });

    // Regroupe les inscriptions par "jour|service|type_code"
    const inscriptions = {};
    etatCmd.commandes.forEach(c => {
      const cle = `${c.jour}|${c.service}|${c.valeur}`;
      (inscriptions[cle] ||= []).push(c.resident_id);
    });

    zone.innerHTML = "";

    if (!etatAnim.animations.length) {
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" },
        "Aucune animation programmée cette semaine. Rendez-vous dans « Animations de la semaine » pour en ajouter.")));
      return;
    }

    // Ordre d'affichage : jours de la semaine (lundi→dimanche), puis service, puis animation
    const jours = U.joursDeLaSemaine(semaine);
    const ordreJour = {}; jours.forEach((j, i) => { ordreJour[j.nom.toLowerCase()] = i; });
    const ordreService = { midi: 0, soir: 1 };
    const animationsTriees = [...etatAnim.animations].sort((a, b) =>
      (ordreJour[a.jour] - ordreJour[b.jour]) || (ordreService[a.service] - ordreService[b.service]) ||
      String(libelleType[a.type_code] || a.type_code).localeCompare(String(libelleType[b.type_code] || b.type_code), "fr"));

    let jourAffiche = null;
    animationsTriees.forEach(a => {
      // Titre de jour (une seule fois), pour structurer visuellement le document
      if (a.jour !== jourAffiche) {
        jourAffiche = a.jour;
        const infoJour = jours.find(j => j.nom.toLowerCase() === a.jour);
        zone.append(U.el("h2", { style: "margin:28px 0 10px;font-size:16px" },
          `${a.jour.charAt(0).toUpperCase()}${a.jour.slice(1)}${infoJour ? " " + U.dateFR(infoJour.date) : ""}`));
      }

      const cleInscrits = `${a.jour}|${a.service}|${a.type_code}`;
      const inscrits = (inscriptions[cleInscrits] || [])
        .map(id => residentParId[id]).filter(Boolean)
        .sort((x, y) => String(x.nom_prenom || "").localeCompare(String(y.nom_prenom || ""), "fr"));

      const nbMixe = inscrits.filter(r => String(r.texture_code || "").toUpperCase().startsWith("M")).length;
      const nbNormal = inscrits.length - nbMixe;

      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, libelleType[a.type_code] || a.type_code),
        U.el("span", { class: "m4s-compteur" },
          `${a.service === "midi" ? "Midi" : "Soir"}${a.lieu_code ? " · " + (libelleGroupe[a.lieu_code] || a.lieu_code) : ""}`),
      ));

      if (!inscrits.length) {
        carte.append(U.el("p", { class: "m4s-placeholder" }, "Aucun résident inscrit pour l'instant."));
      } else {
        const cadre = U.el("div", { class: "m4s-tableau-cadre" });
        const thead = U.el("thead", {}, U.el("tr", {},
          U.el("th", {}, "Résident"), U.el("th", {}, "Groupe"), U.el("th", {}, "Aversions"), U.el("th", {}, "Allergies")));
        const tbody = U.el("tbody");
        inscrits.forEach(r => {
          const mixe = String(r.texture_code || "").toUpperCase().startsWith("M");
          tbody.append(U.el("tr", { class: mixe ? "m4s-ligne--mixe" : null },
            U.el("td", { style: "font-weight:500" }, r.nom_prenom || "—"),
            U.el("td", {}, U.el("span", { class: "m4s-badge m4s-badge--normal" }, libelleGroupe[r.groupe_code] || r.groupe_code || "—")),
            U.el("td", { class: "m4s-muet" }, r.aversions || "—"),
            U.el("td", { class: "m4s-muet" }, r.allergies || "—"),
          ));
        });
        cadre.append(U.el("table", { class: "m4s-tableau" }, thead, tbody));
        carte.append(cadre);
      }

      // Ligne de synthèse (toujours affichée, même sans inscrit)
      const synth = U.el("div", { style: "display:flex;gap:24px;padding:12px 20px;border-top:1px solid var(--bordure);font-size:13px;font-weight:600" },
        U.el("span", {}, `👤 Encadrants : ${a.nb_repas_pers || 0}`),
        U.el("span", {}, `Mixé : ${nbMixe}`),
        U.el("span", {}, `Normal : ${nbNormal}`),
        U.el("span", { style: "margin-left:auto;font-weight:800" }, `Total présents : ${inscrits.length}`),
      );
      carte.append(synth);
      zone.append(carte);
    });
  }

  // Index des jours de la semaine (lundi=0 … dimanche=6), pour placer une
  // ligne "commandes_repas" (jour + semaine du lundi) sur un calendrier.
  const JOUR_INDEX = { lundi: 0, mardi: 1, mercredi: 2, jeudi: 3, vendredi: 4, samedi: 5, dimanche: 6 };
  const MOIS_FR = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
                   "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  // Couleurs de la légende, réutilisant le code couleur déjà en place dans
  // toute l'application (cases de la commande résidents), pour rester
  // cohérent plutôt que d'inventer une palette propre à cet écran.
  const LEGENDE_PLANNING = [
    { cle: "present",    libelle: "Présent",    coul: "#A9E8C0" },
    { cle: "sortie",     libelle: "Absent",     coul: "#F0BCBC" },
    { cle: "animation",  libelle: "Animation",  coul: "#F0D9A8" },
    { cle: "invitation", libelle: "Invitation", coul: "#A8DDE4" },
    { cle: "autre",      libelle: "Autre",      coul: "#CABDEA" },
    { cle: "horsperiode",libelle: "Hors période (accueil temporaire)", coul: "#FFFFFF" },
  ];

  /* ===== [D1] PLANNING RÉSIDENTS & AT — calendrier annuel ==============
     Reproduction du planning annuel de MSP : un résident (ou une personne
     en accueil temporaire) sélectionné, 12 mini-calendriers pour l'année
     choisie, chaque jour scindé en 2 triangles (midi à gauche, soir à
     droite) colorés selon le statut. Bouton Imprimer, dans une fenêtre
     dédiée avec couleurs figées (comme MSP), pour un rendu A4 fiable.

     Adaptations par rapport à MSP :
     • La légende reprend les CATÉGORIES de statuts de M4S (animation,
       sortie, invitation, autre) plutôt que les 4 statuts fixes de MSP
       (OK/ABS/PN/Délocalisé), le référentiel de M4S étant plus riche (24
       statuts contre 4). C'est la même logique de couleur que partout
       ailleurs dans l'application.
     • « Hors période » ne s'applique qu'aux personnes en ACCUEIL
       TEMPORAIRE, calculé précisément à partir de leurs séjours (dates
       exactes) plutôt que d'une activation par semaine entière.
     • MSP gère aussi des « absences planifiées » (congés/hospitalisation,
       multi-jours, prioritaires sur le statut du jour) : cette notion
