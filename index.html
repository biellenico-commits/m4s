       n'existe pas encore dans M4S et n'est donc pas reproduite ici. Elle
       peut être ajoutée comme un module à part si besoin.
     ==================================================================== */
  async function vuePlanning(conteneur, module) {
    conteneur.innerHTML = "";
    conteneur.append(titrePage("Planning résidents & AT", "Calendrier annuel, par personne"));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));

    let residents, types, sejours;
    try {
      [residents, types, sejours] = await Promise.all([
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerSejours(),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    const categorieDuStatut = {}; types.forEach(t => { categorieDuStatut[t.code] = t.categorie; });
    const permanents = residents.filter(r => r.type !== "temporaire").sort((a, b) => String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr"));
    const temporaires = residents.filter(r => r.type === "temporaire").sort((a, b) => String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr"));

    const anneeAuj = new Date().getFullYear();
    const annees = [anneeAuj - 1, anneeAuj, anneeAuj + 1, anneeAuj + 2];
    if (!ETAT.anneePlanning) ETAT.anneePlanning = anneeAuj;
    if (!ETAT.personnePlanning && residents.length) ETAT.personnePlanning = residents[0].id;

    // --- Sélecteurs (personne groupée par optgroup, année, impression) ---
    const cPersonne = U.el("select", { class: "m4s-select", style: "min-width:260px" });
    const grpRes = U.el("optgroup", { label: "Résidents" });
    permanents.forEach(r => grpRes.append(U.el("option", { value: r.id, selected: String(r.id) === String(ETAT.personnePlanning) }, r.nom_prenom)));
    cPersonne.append(grpRes);
    if (temporaires.length) {
      const grpAT = U.el("optgroup", { label: "Accueil temporaire" });
      temporaires.forEach(r => grpAT.append(U.el("option", { value: r.id, selected: String(r.id) === String(ETAT.personnePlanning) }, r.nom_prenom)));
      cPersonne.append(grpAT);
    }
    cPersonne.addEventListener("change", () => { ETAT.personnePlanning = parseInt(cPersonne.value, 10); dessiner(); });

    const cAnnee = selectListe(annees.map(a => ({ code: a, libelle: String(a) })), ETAT.anneePlanning, "code", "libelle");
    cAnnee.addEventListener("change", () => { ETAT.anneePlanning = parseInt(cAnnee.value, 10); dessiner(); });

    const btnImprimer = U.el("button", {
      class: "m4s-btn m4s-btn--or",
      onclick: () => imprimerPlanning(personneActive(), ETAT.anneePlanning, donneesActives, categorieDuStatut),
    }, "🖨 Imprimer");

    const barre = U.el("div", { class: "m4s-filtres m4s-no-print", style: "gap:12px;margin-bottom:18px" }, cPersonne, cAnnee, btnImprimer);

    const legende = U.el("div", { class: "m4s-info m4s-no-print", style: "flex-wrap:wrap;gap:14px" },
      U.el("strong", {}, "Légende (gauche = midi, droite = soir) :"),
      ...LEGENDE_PLANNING.map(l => U.el("span", { style: "display:flex;align-items:center;gap:5px" },
        U.el("span", { style: `width:14px;height:14px;border-radius:3px;background:${l.coul};border:1px solid var(--bordure)` }),
        l.libelle)));

    const grilleAnnee = U.el("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px" });

    zone.innerHTML = "";
    zone.append(barre, legende, grilleAnnee);

    function personneActive() { return residents.find(r => r.id === ETAT.personnePlanning); }

    let donneesActives = { statuts: new Map(), sejoursPersonne: [] };

    async function dessiner() {
      const p = personneActive();
      grilleAnnee.innerHTML = "";
      if (!p) { grilleAnnee.append(U.el("p", { class: "m4s-placeholder" }, "Aucune personne à afficher.")); return; }

      let lignes;
      try { lignes = await PERSISTANCE.chargerStatutsAnnee(p.id, ETAT.anneePlanning); }
      catch (e) { grilleAnnee.append(U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)); return; }

      // Index "AAAA-MM-JJ|service" → valeur du statut
      const statuts = new Map();
      lignes.forEach(l => {
        const dateDebut = l.semaines?.date_debut;
        if (!dateDebut) return;
        const d = new Date(dateDebut + "T00:00:00");
        d.setDate(d.getDate() + (JOUR_INDEX[l.jour] ?? 0));
        statuts.set(`${U.isoDate(d)}|${l.service}`, l.valeur);
      });

      const sejoursPersonne = sejours.filter(s => s.resident_id === p.id);
      donneesActives = { statuts, sejoursPersonne };

      construireGrille(grilleAnnee, p, ETAT.anneePlanning, statuts, sejoursPersonne, categorieDuStatut, false);
    }

    dessiner();
  }

  // Détermine la couleur (catégorie) d'un service donné à une date donnée
  function categorieJour(iso, service, statuts, categorieDuStatut) {
    const valeur = statuts.get(`${iso}|${service}`);
    if (!valeur) return "present";
    return categorieDuStatut[valeur] || "autre";
  }

  // Une personne en accueil temporaire n'est « en période » que si un de
  // ses séjours couvre la date donnée.
  function enPeriode(iso, type, sejoursPersonne) {
    if (type !== "temporaire") return true;
    return sejoursPersonne.some(s => s.date_debut <= iso && s.date_fin >= iso);
  }

  // Construit les 12 mini-calendriers (utilisé à l'écran ET à l'impression,
  // pour garantir un rendu strictement identique).
  function construireGrille(conteneur, personne, annee, statuts, sejoursPersonne, categorieDuStatut, pourImpression) {
    // « na » = service non applicable (soir de l'accueil de jour) → gris neutre
    const teinte = { present: "#A9E8C0", sortie: "#F0BCBC", animation: "#F0D9A8", invitation: "#A8DDE4", autre: "#CABDEA", na: "#E5E7EB" };
    const NOMS_JOUR = ["L", "M", "M", "J", "V", "S", "D"];

    for (let m = 0; m < 12; m++) {
      const carteMois = pourImpression
        ? U.el("div", { class: "p-mois" })
        : U.el("div", { class: "m4s-carte", style: "padding:10px" });
      carteMois.append(U.el("div", {
        style: `font-size:${pourImpression ? "12px" : "13px"};font-weight:700;text-align:center;margin-bottom:6px;text-transform:capitalize`,
      }, `${MOIS_FR[m]} ${annee}`));

      const grille = U.el("div", { style: "display:grid;grid-template-columns:repeat(7,1fr);gap:2px" });
      NOMS_JOUR.forEach(j => grille.append(U.el("div", { style: "font-size:9px;text-align:center;color:var(--texte-tres-doux);font-weight:700" }, j)));

      const premier = new Date(annee, m, 1);
      const dernier = new Date(annee, m + 1, 0);
      const decalage = (premier.getDay() + 6) % 7;   // lundi = 0
      for (let i = 0; i < decalage; i++) grille.append(U.el("div"));

      for (let jour = 1; jour <= dernier.getDate(); jour++) {
        const d = new Date(annee, m, jour);
        const iso = U.isoDate(d);
        const type = personne.type === "temporaire" ? "temporaire" : "permanent";
        const horsPeriode = !enPeriode(iso, type, sejoursPersonne);

        let cellule;
        if (horsPeriode) {
          cellule = U.el("div", {
            style: "aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:3px;background:var(--fond);color:var(--texte-tres-doux);opacity:.45",
          }, String(jour));
        } else {
          const cMidi = teinte[categorieJour(iso, "midi", statuts, categorieDuStatut)];
          const cSoir = serviceApplicable(personne.groupe_code, "soir")
            ? teinte[categorieJour(iso, "soir", statuts, categorieDuStatut)]
            : teinte.na;   // [ADJ] pas de repas le soir
          cellule = U.el("div", {
            style: "aspect-ratio:1;position:relative;font-size:10px;font-weight:700;border-radius:3px;overflow:hidden;border:1px solid var(--bordure);display:flex;align-items:center;justify-content:center",
            title: "Midi / Soir",
          },
            U.el("div", { style: `position:absolute;inset:0;background:${cMidi};clip-path:polygon(0 0,100% 0,0 100%)` }),
            U.el("div", { style: `position:absolute;inset:0;background:${cSoir};clip-path:polygon(100% 0,100% 100%,0 100%)` }),
            U.el("span", { style: "position:relative;z-index:1" }, String(jour)));
        }
        grille.append(cellule);
      }
      carteMois.append(grille);
      conteneur.append(carteMois);
    }
  }

  // Ouvre une fenêtre dédiée à l'impression (couleurs figées en hexadécimal,
  // indépendantes du thème, comme fait MSP) — rendu A4 fiable, 3 colonnes.
  function imprimerPlanning(personne, annee, { statuts, sejoursPersonne }, categorieDuStatut) {
    if (!personne) { toast("Sélectionnez une personne.", "erreur"); return; }
    const fenetre = window.open("", "_blank");
    if (!fenetre) { toast("Le navigateur a bloqué la fenêtre d'impression.", "erreur", 6000); return; }

    const conteneurTmp = document.createElement("div");
    construireGrille(conteneurTmp, personne, annee, statuts, sejoursPersonne, categorieDuStatut || {}, true);

    const style = `
      @page { size: A4 portrait; margin: 10mm; }
      * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
      body { color:#1A2332; }
      .p-entete { margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid #1A2332; }
      .p-entete h1 { font-size:18px; margin-bottom:2px; }
      .p-entete .sous { font-size:12px; color:#555; }
      .p-legende { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; font-size:9px; align-items:center; }
      .p-legende .puce { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:3px; border:1px solid #ccc; }
      .p-grille { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
      .p-mois { border:1px solid #DDE2E9; border-radius:5px; padding:7px; }
      @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
    `;
    const legendeHTML = LEGENDE_PLANNING.map(l =>
      `<span><span class="puce" style="background:${l.coul}"></span>${l.libelle}</span>`).join("");

    fenetre.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Planning ${personne.nom_prenom}</title><style>${style}</style></head><body>
      <div class="p-entete">
        <h1>${personne.nom_prenom}${personne.type === "temporaire" ? " (Accueil temporaire)" : ""}</h1>
        <div class="sous">Planning annuel ${annee}</div>
      </div>
      <div class="p-legende"><strong>Légende (gauche = midi, droite = soir) :</strong>${legendeHTML}</div>
      <div class="p-grille">${conteneurTmp.innerHTML}</div>
    </body></html>`);
    fenetre.document.close();
    setTimeout(() => fenetre.print(), 400);
  }

  /* ===== [B3] PRODUCTION CUISINE — feuille de production (lecture) ====
     Reproduit l'onglet CUISINE : pour UN jour et UN service, le nombre
     de portions à préparer par TEXTURE (Normal/Mixé) et par PLAT
     (Entrée/Plat/Dessert) — calcul basé sur les textures et portions
     propres à chaque plat (un résident peut avoir une texture différente
     pour son entrée et son dessert), regroupées par :
       • 1er service, par groupe
       • 2e service, par groupe (dont ADJ)
       • Repas spéciaux : un bloc par animation programmée ce jour/service
         (ces résidents sortent du compte de leur groupe : ils mangent
         ailleurs, à l'animation)
     Un résident absent (statut de catégorie « sortie ») n'est compté
     nulle part, et apparaît dans la liste des absents en bas de page.
     Sous le tableau : effectifs encadrants/familles (non ventilés par
     texture, la donnée n'existe pas à ce niveau) et le rappel du plat
     témoin, une portion normale fixe conservée par principe qualité.
     ==================================================================== */
  async function vueProductionCuisine(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Production cuisine"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
      U.el("div", { class: "m4s-actions m4s-no-print" },
        U.el("button", { class: "m4s-btn m4s-btn--or", onclick: () => window.print() }, "🖨 Imprimer")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let groupes, residents, types, etatCmd, etatEnc, etatFam, etatAnim;
    try {
      [groupes, residents, types, etatCmd, etatEnc, etatFam, etatAnim] = await Promise.all([
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerCommandes(semaine),
        PERSISTANCE.chargerCommandesEncadrants(semaine),
        PERSISTANCE.chargerCommandesFamilles(semaine),
        PERSISTANCE.chargerAnimationsSemaine(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    const categorieDuStatut = {}; types.forEach(t => { categorieDuStatut[t.code] = t.categorie; });
    const libelleType = {}; types.forEach(t => { libelleType[t.code] = t.libelle; });
    const groupesAffiches = groupesHabites(groupes, residents);

    const indexResidents = new Map();
    etatCmd.commandes.forEach(c => indexResidents.set(`${c.resident_id}|${c.jour}|${c.service}`, c.valeur));

    const jours = U.joursDeLaSemaine(semaine);
    // Jour par défaut : celui d'aujourd'hui si la semaine est la semaine en
    // cours, sinon le premier jour de la semaine affichée.
    const ajd = U.isoDate(new Date());
    if (!ETAT.jourProdCuisine || !jours.some(j => j.date === ETAT.jourProdCuisine)) {
      ETAT.jourProdCuisine = (jours.find(j => j.date === ajd) || jours[0]).date;
    }
    if (!ETAT.serviceProdCuisine) ETAT.serviceProdCuisine = "midi";

    // Additionne les portions d'un résident dans un compteur { entreeN, entreeM, platN, platM, dessertN, dessertM }
    function ajouterPortions(acc, r) {
      const estMixe = code => String(code || "").toUpperCase().startsWith("M");
      const tE = estMixe(r.texture_entree || r.texture_code);
      const tP = estMixe(r.texture_plat || r.texture_code);
      const tD = estMixe(r.texture_dessert || r.texture_code);
      acc[tE ? "entreeM" : "entreeN"] += Number(r.portion_entree ?? 1) || 0;
      acc[tP ? "platM" : "platN"] += Number(r.portion_plat ?? 1) || 0;
      acc[tD ? "dessertM" : "dessertN"] += Number(r.portion_dessert ?? 1) || 0;
    }
    const videPortions = () => ({ entreeN: 0, entreeM: 0, platN: 0, platM: 0, dessertN: 0, dessertM: 0 });
    const addPortions = (a, b) => { Object.keys(a).forEach(k => a[k] += b[k]); return a; };

    function dessiner() {
      const jour = ETAT.jourProdCuisine;
      const service = ETAT.serviceProdCuisine;
      const jourCle = jours.find(j => j.date === jour)?.nom.toLowerCase();

      zone.innerHTML = "";

      // --- Sélecteurs jour + service ---
      const barreJours = U.el("div", { class: "m4s-filtres m4s-no-print" });
      jours.forEach(j => barreJours.append(U.el("button", {
        class: "m4s-filtre-btn" + (jour === j.date ? " m4s-filtre-btn--actif" : ""),
        onclick: () => { ETAT.jourProdCuisine = j.date; dessiner(); },
      }, `${j.nom.slice(0, 3)} ${U.dateFR(j.date).slice(0, 5)}`)));
      const barreService = U.el("div", { class: "m4s-filtres m4s-no-print", style: "margin-top:8px" },
        U.el("button", { class: "m4s-filtre-btn" + (service === "midi" ? " m4s-filtre-btn--actif" : ""), onclick: () => { ETAT.serviceProdCuisine = "midi"; dessiner(); } }, "Midi"),
        U.el("button", { class: "m4s-filtre-btn" + (service === "soir" ? " m4s-filtre-btn--actif" : ""), onclick: () => { ETAT.serviceProdCuisine = "soir"; dessiner(); } }, "Soir"));
      zone.append(barreJours, barreService);

      zone.append(U.el("h2", { style: "margin:20px 0 10px;font-size:16px" },
        `${jourCle.charAt(0).toUpperCase()}${jourCle.slice(1)} ${U.dateFR(jour)} — ${service === "midi" ? "Midi" : "Soir"}`));

      // --- Répartition des résidents en compartiments ---
      const absents = [];
      const parGroupeService = {};   // "groupe|1er|2e" → { portions, effectif }
      const parAnimation = {};       // type_code → { portions, effectif, residents:[] }

      residents.forEach(r => {
        if (!groupesAffiches.some(g => g.code === r.groupe_code)) return;   // écarte AT/lieux
        if (!serviceApplicable(r.groupe_code, service)) return;             // [ADJ] non concerné le soir
        const valeur = indexResidents.get(`${r.id}|${jourCle}|${service}`) || "";
        const cat = valeur ? (categorieDuStatut[valeur] || "autre") : null;

        if (cat === "sortie") { absents.push(r); return; }

        if (cat === "animation") {
          const bloc = (parAnimation[valeur] ||= { portions: videPortions(), effectif: 0, residents: [] });
          ajouterPortions(bloc.portions, r); bloc.effectif++; bloc.residents.push(r);
          return;
        }

        const positionService = Number(r.service_midi) === 1 ? "1er" : "2e";
        const cle = `${r.groupe_code}|${positionService}`;
        const bloc = (parGroupeService[cle] ||= { portions: videPortions(), effectif: 0 });
        ajouterPortions(bloc.portions, r); bloc.effectif++;
      });

      // --- Construction du tableau ---
      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const trE1 = U.el("tr", {},
        U.el("th", { rowspan: 2 }, "Repas"),
        U.el("th", { rowspan: 2, style: "text-align:right" }, "Effectif"),
        U.el("th", { colspan: 3, style: "text-align:center" }, "Normal"),
        U.el("th", { colspan: 3, style: "text-align:center" }, "Mixé"));
      const trE2 = U.el("tr", {},
        ...["Entrée", "Plat", "Dessert", "Entrée", "Plat", "Dessert"].map(l => U.el("th", { style: "text-align:right" }, l)));
      const tbody = U.el("tbody");

      const ligne = (libelle, p, effectif, accent = false) => U.el("tr", { class: accent ? "m4s-ligne-total" : null },
        U.el("td", { style: accent ? "font-weight:800" : "font-weight:500" }, libelle),
        U.el("td", { style: "text-align:right" }, effectif),
        ...["entreeN", "platN", "dessertN", "entreeM", "platM", "dessertM"].map(k =>
          U.el("td", { style: "text-align:right" }, p[k] || "")));

      // 1er service, par groupe
      const total1er = videPortions(); let eff1er = 0;
      groupesAffiches.forEach(g => {
        const b = parGroupeService[`${g.code}|1er`];
        if (b) { tbody.append(ligne(`1er service — ${g.libelle || g.code}`, b.portions, b.effectif)); addPortions(total1er, b.portions); eff1er += b.effectif; }
      });
      if (eff1er) tbody.append(ligne("Total 1er service", total1er, eff1er, true));

      // 2e service, par groupe
      const total2e = videPortions(); let eff2e = 0;
      groupesAffiches.forEach(g => {
        const b = parGroupeService[`${g.code}|2e`];
        if (b) { tbody.append(ligne(`2e service — ${g.libelle || g.code}`, b.portions, b.effectif)); addPortions(total2e, b.portions); eff2e += b.effectif; }
      });
      if (eff2e) tbody.append(ligne("Total 2e service", total2e, eff2e, true));

      // Repas spéciaux (animations)
      const totalAnim = videPortions(); let effAnim = 0;
      const codesAnim = Object.keys(parAnimation);
      if (codesAnim.length) {
        tbody.append(U.el("tr", {}, U.el("td", { colspan: 8, style: "font-weight:700;color:var(--texte-doux);padding-top:14px" }, "Repas spéciaux (animations)")));
        codesAnim.forEach(code => {
          const b = parAnimation[code];
          tbody.append(ligne(libelleType[code] || code, b.portions, b.effectif));
          addPortions(totalAnim, b.portions); effAnim += b.effectif;
        });
      }

      // Plat témoin : convention qualité fixe (1 portion normale conservée)
      const platTemoin = { ...videPortions(), entreeN: 1, platN: 1, dessertN: 1 };
      tbody.append(ligne("Plat témoin", platTemoin, "—"));

      // Total général
      const totalGeneral = addPortions(addPortions(addPortions({ ...total1er }, total2e), totalAnim), platTemoin);
      tbody.append(ligne("TOTAL GÉNÉRAL", totalGeneral, eff1er + eff2e + effAnim, true));

      cadre.append(U.el("table", { class: "m4s-tableau" }, U.el("thead", {}, trE1, trE2), tbody));
      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(cadre);
      zone.append(carte);

      // --- Effectifs annexes : encadrants, familles ---
      const totalEnc = etatEnc.lignes.filter(l => l.jour === jourCle && l.service === service)
        .reduce((s, l) => s + (l.nombre || 0), 0);
      const totalFam = etatFam.lignes.filter(l => l.jour === jourCle && l.service === service)
        .reduce((s, l) => s + (l.nombre || 0), 0);

      zone.append(U.el("div", { class: "m4s-carte" }, U.el("div", { style: "padding:16px 20px;display:flex;gap:32px;font-weight:600" },
        U.el("span", {}, `👥 Encadrants : ${totalEnc}`),
        U.el("span", {}, `👨‍👩‍👧 Familles : ${totalFam}`),
        U.el("span", { class: "m4s-muet", style: "font-weight:400" }, "(effectifs non ventilés par texture)"),
      )));

      // --- Absents ---
      if (absents.length) {
        zone.append(U.el("div", { class: "m4s-carte" }, U.el("div", { style: "padding:16px 20px" },
          U.el("strong", {}, `Absents (${absents.length}) : `),
          U.el("span", { class: "m4s-muet" }, absents.map(r => r.nom_prenom).join(", ")),
        )));
      }
    }

    dessiner();
  }

  /* ===== [B1] TABLEAU DE PRÉSENCE — document de synthèse (lecture) ====
     Reproduit l'onglet TABLEAU du classeur : pour un groupe et une
     semaine donnés, la liste des résidents avec leur statut par jour et
     service (même code couleur que la commande), suivie des compteurs
     utiles à la cuisine : présents par service, dont mixé/normal,
     encadrants, familles, total général. Lecture seule — la saisie se
     fait dans « Commande repas résidents / encadrants / famille ».
     Convention (alignée sur le reste de l'app) : un résident compte
     comme absent uniquement si son statut du jour appartient à la
     catégorie « sortie » ; les animations et invitations restent
     comptées présentes (un repas doit leur être préparé).
     ==================================================================== */
  async function vueTableauPresence(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Tableau de présence"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
      U.el("div", { class: "m4s-actions m4s-no-print" },
        U.el("button", { class: "m4s-btn m4s-btn--or", onclick: () => imprimerTableauPresence() }, "🖨 Imprimer")),
    ));

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));
    if (!semaine) return;

    let groupes, residents, types, etatCmd, etatEnc, etatFam, categoriesEnc;
    try {
      [groupes, residents, types, etatCmd, etatEnc, etatFam, categoriesEnc] = await Promise.all([
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerCommandes(semaine),
        PERSISTANCE.chargerCommandesEncadrants(semaine),
        PERSISTANCE.chargerCommandesFamilles(semaine),
        PERSISTANCE.chargerCategoriesEncadrants(),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    const categorieDuStatut = {};
    types.forEach(t => { categorieDuStatut[t.code] = t.categorie; });

    const indexResidents = new Map();   // "residentId|jour|service" → valeur
    etatCmd.commandes.forEach(c => indexResidents.set(`${c.resident_id}|${c.jour}|${c.service}`, c.valeur));

    const indexEncadrants = new Map();  // "groupe|jour|service" → total
    etatEnc.lignes.forEach(l => {
      const cle = `${l.groupe_code}|${l.jour}|${l.service}`;
      indexEncadrants.set(cle, (indexEncadrants.get(cle) || 0) + (l.nombre || 0));
    });

    const indexFamilles = new Map();    // "residentId|jour|service" → nombre
    etatFam.lignes.forEach(l => indexFamilles.set(`${l.resident_id}|${l.jour}|${l.service}`, l.nombre || 0));

    const groupesAffiches = groupesHabites(groupes, residents);
    if (!ETAT.groupeTableauPresence || !groupesAffiches.some(g => g.code === ETAT.groupeTableauPresence)) {
      ETAT.groupeTableauPresence = groupesAffiches[0]?.code || null;
    }

    const jours = U.joursDeLaSemaine(semaine);
    const SERVICES = ["midi", "soir"];
    const COULEURS_JOUR = ["var(--lundi)", "var(--mardi)", "var(--mercredi)", "var(--jeudi)",
                           "var(--vendredi)", "var(--samedi)", "var(--dimanche)"];

    function dessiner() {
      const groupe = ETAT.groupeTableauPresence;
      const liste = residents.filter(r => (r.groupe_code || "") === groupe)
        .sort((a, b) => String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr"));

      zone.innerHTML = "";

      const barre = U.el("div", { class: "m4s-filtres m4s-no-print", style: "margin-bottom:16px" });
      groupesAffiches.forEach(g => barre.append(U.el("button", {
        class: "m4s-filtre-btn" + (groupe === g.code ? " m4s-filtre-btn--actif" : ""),
        onclick: () => { ETAT.groupeTableauPresence = g.code; dessiner(); },
      }, g.libelle || g.code)));
      zone.append(barre);

      const carte = U.el("div", { class: "m4s-carte" });
      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, groupesAffiches.find(g => g.code === groupe)?.libelle || groupe),
        U.el("span", { class: "m4s-compteur" }, `${liste.length} résident(s)`),
      ));

      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const trE = U.el("tr", {}, U.el("th", { style: "min-width:190px" }, "Résident"));
      jours.forEach((j, i) => trE.append(U.el("th", {
        class: "m4s-th-jour", colspan: 2,
        style: `border-bottom:2px solid ${COULEURS_JOUR[i]};border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[i]} 60%, transparent);background:color-mix(in srgb, ${COULEURS_JOUR[i]} 20%, var(--fond))`,
      },
        U.el("div", { class: "m4s-jour-nom", style: `color:${COULEURS_JOUR[i]}` }, `${j.nom.toUpperCase()} ${U.dateFR(j.date).slice(0, 5)}`),
        U.el("div", { class: "m4s-services" }, U.el("span", {}, "MIDI"), U.el("span", {}, "SOIR")))));
      const tbody = U.el("tbody");

      // Compteurs à agréger pendant le parcours des lignes
      const compte = {};   // "jour|service|clé" → nombre
      const inc = (jourCle, service, cle, n = 1) => {
        const k = `${jourCle}|${service}|${cle}`;
        compte[k] = (compte[k] || 0) + n;
      };

      liste.forEach((r, idxLigne) => {
        const tdNom = U.el("td", { style: "font-weight:500;white-space:nowrap" }, r.nom_prenom || "—");
        if (r.type === "temporaire") tdNom.append(" ", U.el("span", { class: "m4s-badge m4s-badge--at" }, "AT"));
        const tr = U.el("tr", {}, tdNom);

        const service1 = Number(r.service_midi) === 1;
        const mixe = String(r.texture_code || "").toUpperCase().startsWith("M");

        jours.forEach((j, iJour) => {
          const jourCle = j.nom.toLowerCase();
          const teinte = `color-mix(in srgb, ${COULEURS_JOUR[iJour]} ${idxLigne % 2 ? 18 : 9}%, white)`;
          SERVICES.forEach((service, iServ) => {
            // [ADJ] Service non applicable → case neutre, hors compteurs
            if (!serviceApplicable(r.groupe_code, service)) {
              tr.append(U.el("td", { class: "m4s-td-case", style: `background:${teinte}` +
                (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "") }, caseNonApplicable()));
              return;
            }
            const valeur = indexResidents.get(`${r.id}|${jourCle}|${service}`) || "";
            const cat = valeur ? (categorieDuStatut[valeur] || "autre") : null;
            const absent = cat === "sortie";

            if (!absent) {
              inc(jourCle, service, service1 ? "s1" : "s2");
              inc(jourCle, service, service1 ? (mixe ? "s1mixe" : "s1normal") : (mixe ? "s2mixe" : "s2normal"));
            }

            const span = U.el("span", { class: "m4s-badge m4s-badge--neutre" }, valeur || "OK");
            if (cat) span.classList.add(`m4s-case--${["animation", "sortie", "invitation"].includes(cat) ? cat : "autre"}`);
            const style = `background:${teinte}` + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : "");
            tr.append(U.el("td", { class: "m4s-td-case", style }, span));
          });
        });
        tbody.append(tr);
      });

      // --- Lignes de synthèse ---
      const idsGroupe = new Set(liste.map(r => r.id));
      const ligneSynthese = (libelle, valeurFn, accent = false) => {
        const tr = U.el("tr", { class: accent ? "m4s-ligne-total" : null },
          U.el("td", { style: accent ? "font-weight:800" : "font-weight:600;color:var(--texte-doux)" }, libelle));
        jours.forEach((j, iJour) => {
          const jourCle = j.nom.toLowerCase();
          SERVICES.forEach((service, iServ) => {
            // [ADJ] Totaux du soir non applicables pour l'accueil de jour
            const v = serviceApplicable(groupe, service) ? valeurFn(jourCle, service) : "—";
            tr.append(U.el("td", {
              class: "m4s-td-case",
              style: `text-align:center;font-weight:${accent ? 800 : 600}` + (iServ === 0 ? `;border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[iJour]} 60%, transparent)` : ""),
            }, v || v === 0 ? String(v) : ""));
          });
        });
        return tr;
      };

      const get = (j, s, cle) => compte[`${j}|${s}|${cle}`] || 0;
      const totalEncadrants = (j, s) => idsGroupe.size ? (indexEncadrants.get(`${groupe}|${j}|${s}`) || 0) : 0;
      const totalFamilles = (j, s) => {
        let n = 0; liste.forEach(r => { n += indexFamilles.get(`${r.id}|${j}|${s}`) || 0; }); return n;
      };

      tbody.append(ligneSynthese("1er service — présents", (j, s) => get(j, s, "s1")));
      tbody.append(ligneSynthese("dont repas mixé", (j, s) => get(j, s, "s1mixe")));
      tbody.append(ligneSynthese("dont repas normal", (j, s) => get(j, s, "s1normal")));
      tbody.append(ligneSynthese("2e service — présents", (j, s) => get(j, s, "s2")));
      tbody.append(ligneSynthese("dont repas mixé", (j, s) => get(j, s, "s2mixe")));
      tbody.append(ligneSynthese("dont repas normal", (j, s) => get(j, s, "s2normal")));
      tbody.append(ligneSynthese("Total résidents", (j, s) => get(j, s, "s1") + get(j, s, "s2")));
      tbody.append(ligneSynthese("Total encadrants", totalEncadrants));
      tbody.append(ligneSynthese("Total familles", totalFamilles));
      tbody.append(ligneSynthese("TOTAL PRÉSENTS",
        (j, s) => get(j, s, "s1") + get(j, s, "s2") + totalEncadrants(j, s) + totalFamilles(j, s), true));

      cadre.append(U.el("table", { class: "m4s-tableau" }, U.el("thead", {}, trE), tbody));
      carte.append(cadre);
      if (!liste.length) carte.append(U.el("p", { class: "m4s-placeholder" }, "Aucun résident dans ce groupe."));
      zone.append(carte);
    }

    // ---------------------------------------------------------------
    // Impression A4 PAYSAGE — fenetre dediee (patron identique a
    // imprimerPlanning). Couleurs figees en hexadecimal (independantes du
    // theme). MEME regle de comptage que l'ecran (absent seulement si le
    // statut est « sortie »). Imprime TOUS les groupes, un par section,
    // avec saut de page ; en-tetes (lettrage + colonnes) et pied REPETES.
    // Ne modifie NI l'affichage ecran NI les calculs.
    // ---------------------------------------------------------------
    function imprimerTableauPresence() {
      if (!residents) { toast("Données en cours de chargement…", "erreur"); return; }
      const fenetre = window.open("", "_blank");
      if (!fenetre) { toast("Le navigateur a bloqué la fenêtre d'impression.", "erreur", 6000); return; }

      const HEX_JOUR = ["#2563EB", "#0D9488", "#B45309", "#B91C1C", "#5B3AA8", "#BE185D", "#0E6B7A"];
      const NCOL = 1 + jours.length * 2;
      const dd = new Date(), pz = n => String(n).padStart(2, "0");
      const edite = `${pz(dd.getDate())}/${pz(dd.getMonth() + 1)}/${dd.getFullYear()} à ${pz(dd.getHours())}:${pz(dd.getMinutes())}`;

      const catOf = v => v ? (categorieDuStatut[v] || "autre") : null;
      const clsCat = cat => cat ? ("st-" + (["animation", "sortie", "invitation"].includes(cat) ? cat : "autre")) : "st-ok";

      // Comptage STRICTEMENT identique a dessiner()
      function compteDe(liste) {
        const c = {};
        const inc = (j, s, cle, n = 1) => { const k = `${j}|${s}|${cle}`; c[k] = (c[k] || 0) + n; };
        liste.forEach(r => {
          const service1 = Number(r.service_midi) === 1;
          const mixe = String(r.texture_code || "").toUpperCase().startsWith("M");
          jours.forEach(j => {
            const jc = j.nom.toLowerCase();
            SERVICES.forEach(service => {
              if (!serviceApplicable(r.groupe_code, service)) return;   // [ADJ] hors compteurs
              const cat = catOf(indexResidents.get(`${r.id}|${jc}|${service}`) || "");
              if (cat === "sortie") return;
              inc(jc, service, service1 ? "s1" : "s2");
              inc(jc, service, service1 ? (mixe ? "s1mixe" : "s1normal") : (mixe ? "s2mixe" : "s2normal"));
            });
          });
        });
        return c;
      }

      function tableGroupe(groupe) {
        const gLib = (groupesAffiches.find(g => g.code === groupe) || {}).libelle || groupe;
        const liste = residents.filter(r => (r.groupe_code || "") === groupe)
          .sort((a, b) => String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr"));
        if (!liste.length) return "";
        const c = compteDe(liste);
        const get = (j, s, cle) => c[`${j}|${s}|${cle}`] || 0;
        const enc = (j, s) => indexEncadrants.get(`${groupe}|${j}|${s}`) || 0;
        const fam = (j, s) => { let n = 0; liste.forEach(r => n += indexFamilles.get(`${r.id}|${j}|${s}`) || 0); return n; };

        let head = `<thead><tr><th class="lettrage" colspan="${NCOL}"><div class="lh">`
          + `<div class="etab"><div class="logo">M4S</div><div><div class="nom">MAS « 4 Saisons »</div><div class="sous">Restauration · Service hôtelier</div></div></div>`
          + `<div class="meta"><div class="ti">Tableau de présence</div><div class="pe">Semaine ${semaine.numero} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}</div><div class="gr">${gLib} · ${liste.length} résident(s)</div></div>`
          + `</div></th></tr><tr><th class="cnomh" rowspan="2">Résident</th>`;
        jours.forEach((j, i) => { head += `<th class="jour" colspan="2" style="border-bottom:2.5pt solid ${HEX_JOUR[i]};color:${HEX_JOUR[i]}">${j.nom.slice(0, 3)} ${U.dateFR(j.date).slice(0, 5)}</th>`; });
        head += `</tr><tr>`;
        jours.forEach(() => { head += `<th class="srv">Midi</th><th class="srv">Soir</th>`; });
        head += `</tr></thead>`;

        const foot = `<tfoot><tr><td class="pied" colspan="${NCOL}"><div class="pd"><span>Édité le <b>${edite}</b> · M4S</span><span>MAS 4 Saisons — Document interne</span></div></td></tr></tfoot>`;

        let body = `<tbody>`;
        liste.forEach(r => {
          body += `<tr><td class="cnom">${r.nom_prenom || "—"}${r.type === "temporaire" ? ' <span class="at">AT</span>' : ""}</td>`;
          jours.forEach(j => {
            const jc = j.nom.toLowerCase();
            SERVICES.forEach((service, iS) => {
              if (!serviceApplicable(r.groupe_code, service)) {   // [ADJ] case neutre
                body += `<td class="cell st-na${iS === 0 ? " db" : ""}">—</td>`; return;
              }
              const v = indexResidents.get(`${r.id}|${jc}|${service}`) || "";
              body += `<td class="cell ${clsCat(catOf(v))}${iS === 0 ? " db" : ""}">${v || "OK"}</td>`;
            });
          });
          body += `</tr>`;
        });
        const ligne = (lib, fn, cls = "") => {
          let tr = `<tr class="syn ${cls}"><td class="lib">${lib}</td>`;
          jours.forEach(j => { const jc = j.nom.toLowerCase(); SERVICES.forEach((service, iS) => { tr += `<td class="val${iS === 0 ? " db" : ""}">${serviceApplicable(groupe, service) ? fn(jc, service) : "—"}</td>`; }); });
          return tr + `</tr>`;
        };
        body += ligne("1<sup>er</sup> service — présents", (j, s) => get(j, s, "s1"), "sep");
        body += ligne("dont repas mixé", (j, s) => get(j, s, "s1mixe"), "dont");
        body += ligne("dont repas normal", (j, s) => get(j, s, "s1normal"), "dont");
        body += ligne("2<sup>e</sup> service — présents", (j, s) => get(j, s, "s2"));
        body += ligne("dont repas mixé", (j, s) => get(j, s, "s2mixe"), "dont");
        body += ligne("dont repas normal", (j, s) => get(j, s, "s2normal"), "dont");
        body += ligne("Total résidents", (j, s) => get(j, s, "s1") + get(j, s, "s2"), "sep");
        body += ligne("Total encadrants", (j, s) => enc(j, s));
        body += ligne("Total familles", (j, s) => fam(j, s));
        body += ligne("TOTAL PRÉSENTS", (j, s) => get(j, s, "s1") + get(j, s, "s2") + enc(j, s) + fam(j, s), "total");
        body += `</tbody>`;
        return `<table class="doc">${head}${foot}${body}</table>`;
      }

      const sections = groupesAffiches.map(g => tableGroupe(g.code)).filter(Boolean)
        .map((t, i) => `<div class="sect"${i > 0 ? ' style="break-before:page"' : ""}>${t}</div>`).join("");
      if (!sections) { toast("Aucun résident à imprimer.", "erreur"); fenetre.close(); return; }

      const style = `
        @page { size: A4 landscape; margin: 12mm; }
        @page { @bottom-right { content: "Page " counter(page) " / " counter(pages); font-family: Arial, sans-serif; font-size: 8pt; color: #8A94A8; } }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; color:#14203A; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        table.doc { width:100%; border-collapse:collapse; font-size:8.4pt; }
        .doc td, .doc th { border:.4pt solid #CBD3DF; white-space:nowrap; }
        thead { display:table-header-group; } tfoot { display:table-footer-group; }
        .lettrage { border:0 !important; padding:0 0 7mm; }
        .lh { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
        .etab { display:flex; align-items:center; gap:10px; }
        .etab .logo { width:38px; height:38px; border-radius:8px; background:#1E3A8A; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
        .etab .nom { font-size:13pt; font-weight:800; } .etab .sous { font-size:8pt; color:#55617A; }
        .meta { text-align:right; } .meta .ti { font-size:14pt; font-weight:800; }
        .meta .pe { font-size:8.5pt; color:#55617A; margin-top:2px; }
        .meta .gr { display:inline-block; margin-top:5px; font-size:8pt; font-weight:700; color:#1E3A8A; background:#EAF0FC; border:.5pt solid #C3D2F0; border-radius:20px; padding:2px 10px; }
        .cnomh { text-align:left; padding:5px 8px; background:#F2F5FA; font-size:7.5pt; font-weight:800; color:#55617A; min-width:42mm; vertical-align:middle; }
        .jour { padding:4px 3px; text-align:center; background:#F7F9FC; font-size:7.6pt; font-weight:800; }
        .srv { padding:3px 2px; text-align:center; background:#F7F9FC; font-size:6.8pt; font-weight:700; color:#8A94A8; width:15mm; }
        .doc tbody td { padding:2.5px 4px; height:6.5mm; }
        .cnom { text-align:left; font-weight:600; padding-left:8px; }
        .cnom .at { font-size:6pt; font-weight:800; background:#E6F5F7; color:#0C6C7A; border:.5pt solid #A7DCE3; border-radius:3px; padding:0 3px; margin-left:3px; }
        .cell { text-align:center; font-weight:700; font-size:7.4pt; }
        .st-ok { color:#8A94A8; font-weight:600; }
        .st-animation { background:#FDF3E3; color:#B45309; }
        .st-sortie { background:#FDECED; color:#C02434; }
        .st-invitation { background:#E6F5F7; color:#0C6C7A; }
        .st-autre { background:#F0ECFA; color:#5B3AA8; }
        .st-na { background:#F1F3F6; color:#A3ADBD; }
        .db { border-left:1.2pt solid #B4BECD !important; }
        .syn td { background:#FBFCFE; font-size:7.8pt; }
        .syn .lib { text-align:left; padding-left:8px; font-weight:600; color:#55617A; }
        .syn .val { text-align:center; font-weight:700; }
        .syn.dont td { background:#fff; }
        .syn.dont .lib { font-weight:500; color:#8A94A8; padding-left:16px; font-size:7.4pt; }
        .syn.sep td { border-top:.9pt solid #B4BECD; }
        .syn.total td { background:#EAF0FC; font-size:8.6pt; }
        .syn.total .lib { font-weight:800; color:#14203A; padding-left:8px; }
        .syn.total .val { font-weight:800; color:#1E3A8A; }
        .pied { border:0 !important; padding:5mm 0 0; }
        .pd { display:flex; justify-content:space-between; font-size:7pt; color:#8A94A8; border-top:.4pt solid #CBD3DF; padding-top:2.5mm; }
        .pd b { color:#55617A; }
      `;
      fenetre.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Tableau de présence — S${semaine.numero} ${semaine.annee}</title><style>${style}</style></head><body>${sections}</body></html>`);
      fenetre.document.close();
      setTimeout(() => fenetre.print(), 400);
    }

    dessiner();
  }

  /* ===== [ACC] TABLEAU DE BORD — module d'accueil (lecture seule) ======
     Porte d'entree de M4S : « que se passe-t-il, qu'est-ce qui necessite
     mon attention, quelles actions rapides ? ». AUCUNE ecriture en base :
     agrege les commandes de la SEMAINE ACTIVE (residents / encadrants /
     familles) + les animations programmees, avec la MEME regle de comptage
     que « Tableau de presence » (absent uniquement si le statut est de
     categorie « sortie » ; animations et invitations comptees presentes).
     Le jour mis en avant est AUJOURD'HUI s'il appartient a la semaine
     active, sinon le lundi de cette semaine.
     ==================================================================== */
  async function vueTableauDeBord(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    // Fabrique d'icone SVG (trait, herite de la couleur du parent)
    function icone(d, taille = 17) {
      const w = document.createElement("span");
      w.style.display = "inline-flex";
      w.innerHTML = '<svg viewBox="0 0 24 24" width="' + taille + '" height="' + taille + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
      return w.firstElementChild;
    }
    const IC = {
      cuisine:    '<path d="M4 3h16v4H4zM6 7v14M18 7v14M6 21h12M9 11h6M9 15h6"/>',
      residents:  '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/>',
      encadrants: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      anim:       '<path d="M12 2l2 5 5 .5-4 3.5 1.5 5L12 18l-4.5 3 1.5-5-4-3.5 5-.5z"/>',
      alerte:     '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
      horloge:    '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      table:      '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/>',
      printer:    '<path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/>',
      eclair:     '<path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>',
    };

    // En-tete de page (meme style que les autres modules)
    conteneur.append(U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Tableau de bord"),
        U.el("div", { class: "m4s-sous" },
          semaine ? "S" + semaine.numero + " — " + semaine.annee + " · du " + U.dateFR(semaine.dateDebut) + " au " + U.dateFR(semaine.dateFin) : "")),
    ));

    const zone = U.el("div", { class: "m4s-tdb" });
    conteneur.append(zone);
    zone.append(U.el("p", { class: "m4s-placeholder" }, "Chargement…"));

    if (!semaine) { zone.innerHTML = ""; zone.append(U.el("p", { class: "m4s-placeholder" }, "Aucune semaine selectionnee.")); return; }

    let groupes, residents, types, etatCmd, etatEnc, etatFam, etatAnim;
    try {
      [groupes, residents, types, etatCmd, etatEnc, etatFam, etatAnim] = await Promise.all([
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerCommandes(semaine),
        PERSISTANCE.chargerCommandesEncadrants(semaine),
        PERSISTANCE.chargerCommandesFamilles(semaine),
        PERSISTANCE.chargerAnimationsSemaine(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Index (memes structures que « Tableau de presence »)
    const categorieDuStatut = {}, libelleDuStatut = {};
    types.forEach(t => { categorieDuStatut[t.code] = t.categorie; libelleDuStatut[t.code] = t.libelle; });
    const idxRes = new Map();
    etatCmd.commandes.forEach(c => idxRes.set(c.resident_id + "|" + c.jour + "|" + c.service, c.valeur));
    const idxEnc = new Map();
    etatEnc.lignes.forEach(l => { const k = l.groupe_code + "|" + l.jour + "|" + l.service; idxEnc.set(k, (idxEnc.get(k) || 0) + (l.nombre || 0)); });
    const idxFam = new Map();
    etatFam.lignes.forEach(l => idxFam.set(l.resident_id + "|" + l.jour + "|" + l.service, l.nombre || 0));

    const jours = U.joursDeLaSemaine(semaine);
    const now = new Date();
    const aujISO = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    const jourActif = jours.find(j => j.date === aujISO) || jours[0];
    const estAujourdHui = jours.some(j => j.date === aujISO);
    const jcle = jourActif.nom.toLowerCase();

    // Present a ce repas si le statut n'est PAS de categorie « sortie »
    function present(r, service) {
      if (!serviceApplicable(r.groupe_code, service)) return false;   // [ADJ] pas de soir
      const val = idxRes.get(r.id + "|" + jcle + "|" + service) || "";
      const cat = val ? (categorieDuStatut[val] || "autre") : null;
      return cat !== "sortie";
    }
    function comptes(service) {
      let resN = 0, resM = 0;
      residents.forEach(r => {
        if (!present(r, service)) return;
        if (String(r.texture_code || "").toUpperCase().startsWith("M")) resM++; else resN++;
      });
      let enc = 0; groupes.forEach(g => enc += idxEnc.get(g.code + "|" + jcle + "|" + service) || 0);
      let fam = 0; residents.forEach(r => fam += idxFam.get(r.id + "|" + jcle + "|" + service) || 0);
      const res = resN + resM;
      return { res, resN, resM, enc, fam, total: res + enc + fam };
    }
    const midi = comptes("midi");
    const soir = comptes("soir");

    // ---- Anomalies reellement calculees ----
    const items = [];
    const sansTexture = residents.filter(r => !String(r.texture_code || "").trim());
    if (sansTexture.length) items.push({ niveau: "bleu", ic: IC.residents,
      titre: sansTexture.length + " resident(s) sans texture renseignee",
      detail: sansTexture.slice(0, 3).map(r => r.nom_prenom).join(", ") + (sansTexture.length > 3 ? "…" : "") + " — a completer dans leur fiche.",
      cle: "residents" });
    if (!etatAnim.animations.length) items.push({ niveau: "ambre", ic: IC.anim,
      titre: "Aucune animation programmee cette semaine",
      detail: "Renseignez-les dans « Animations de la semaine » pour filtrer les statuts.",
      cle: "anim-semaine" });

    // ---- Rendu ----
    zone.innerHTML = "";
    const carte = (titreTxte, iconeD, compteTxte) => {
      const tete = U.el("div", { class: "m4s-tdb-carte__tete" });
      const svg = icone(iconeD, 17); svg.classList.add("m4s-tdb-svg"); tete.append(svg);
      tete.append(U.el("h2", {}, titreTxte));
      if (compteTxte) tete.append(U.el("span", { class: "m4s-tdb-compte" }, compteTxte));
      return U.el("div", { class: "m4s-tdb-carte" }, tete);
    };

    // ===== Ligne 1 : hero + tuiles =====
    const l1 = U.el("div", { class: "m4s-tdb-grille m4s-tdb-grille--2" });
    const prod = U.el("div", { class: "m4s-tdb-prod" });
    const prodTete = U.el("div", { class: "m4s-tdb-carte__tete" });
    const svgProd = icone(IC.cuisine, 17); svgProd.classList.add("m4s-tdb-svg"); prodTete.append(svgProd);
    prodTete.append(U.el("h2", {}, "A produire — " + (estAujourdHui ? "aujourd'hui" : jourActif.nom.toLowerCase() + " " + U.dateFR(jourActif.date).slice(0, 5))));
    prod.append(prodTete);
    const services = U.el("div", { class: "m4s-tdb-prod__services" });
    const blocService = (cls, libelle, c) => {
      const pctN = c.res ? Math.round(c.resN / c.res * 100) : 0;
      const s = U.el("div", { class: "m4s-tdb-service " + cls });
      s.append(U.el("div", { class: "m4s-tdb-service__lib" }, U.el("span", { class: "m4s-tdb-pt" }), libelle));
      s.append(U.el("div", { class: "m4s-tdb-service__nb" }, U.el("b", {}, String(c.total)), U.el("span", {}, "couverts")));
      s.append(U.el("div", { class: "m4s-tdb-tex" },
        U.el("div", { class: "n", style: "width:" + pctN + "%" }),
        U.el("div", { class: "m", style: "width:" + (100 - pctN) + "%" })));
      s.append(U.el("div", { class: "m4s-tdb-texleg" },
        U.el("span", { html: '<i class="n"></i>Normal <b>' + c.resN + '</b>' }),
        U.el("span", { html: '<i class="m"></i>Mixe <b>' + c.resM + '</b>' })));
      return s;
    };
    services.append(blocService("m4s-tdb-service--midi", "Service du midi", midi));
    services.append(blocService("m4s-tdb-service--soir", "Service du soir", soir));
    prod.append(services);
    const detail = U.el("div", { class: "m4s-tdb-detail" });
    const chip = (lib, val) => U.el("span", { class: "m4s-tdb-chip", html: lib + " <b>" + val + "</b>" });
    detail.append(chip("Residents (midi)", midi.res));
    detail.append(chip("Encadrants", midi.enc));
    detail.append(chip("Familles", midi.fam));
    prod.append(detail);
    l1.append(prod);

    const tiles = U.el("div", { class: "m4s-tdb-grille m4s-tdb-grille--tiles" });
    const tile = (iconeD, cls, nb, lib) => {
      const ic = U.el("div", { class: "m4s-tdb-stat__ic " + cls }); ic.append(icone(iconeD, 18));
      return U.el("div", { class: "m4s-tdb-stat" }, ic,
        U.el("div", { class: "m4s-tdb-stat__nb" }, String(nb)),
        U.el("div", { class: "m4s-tdb-stat__lib" }, lib));
    };
    tiles.append(tile(IC.residents, "m4s-tdb-i-bleu", midi.total, "Presents a midi"));
    tiles.append(tile(IC.residents, "m4s-tdb-i-sarc", soir.total, "Presents au soir"));
    tiles.append(tile(IC.anim, "m4s-tdb-i-vert", etatAnim.animations.length, "Animations cette semaine"));
    tiles.append(tile(IC.alerte, "m4s-tdb-i-ambre", items.length, "Points a verifier"));
    l1.append(tiles);
    zone.append(l1);

    // ===== Ligne 2 : a traiter + la journee =====
    const l2 = U.el("div", { class: "m4s-tdb-grille m4s-tdb-grille--2" });
    const cAttn = carte("A traiter", IC.alerte, items.length ? items.length + " element(s)" : "");
    if (!items.length) cAttn.append(U.el("div", { class: "m4s-tdb-vide" }, "Rien a signaler pour cette semaine."));
    else items.forEach(it => {
      const bt = U.el("button", { class: "m4s-tdb-attn", type: "button", onclick: () => ROUTAGE.aller(it.cle) });
      const ic = U.el("div", { class: "m4s-tdb-attn__ic m4s-tdb-lvl-" + it.niveau }); ic.append(icone(it.ic, 16));
      bt.append(ic, U.el("div", { class: "m4s-tdb-attn__tx" }, U.el("b", {}, it.titre), U.el("span", {}, it.detail)));
      cAttn.append(bt);
    });
    l2.append(cAttn);

    const animsJour = etatAnim.animations.filter(a => a.jour === jcle);
    const cJour = carte("La journee", IC.horloge, "");
    if (!animsJour.length) cJour.append(U.el("div", { class: "m4s-tdb-vide" }, "Aucune animation programmee ce jour."));
    else {
      const couleurs = { midi: "var(--bleu)", soir: "var(--tdb-soir)" };
      animsJour.forEach(a => {
        cJour.append(U.el("div", { class: "m4s-tdb-jour" },
          U.el("span", { class: "m4s-tdb-jour__h" }, a.service === "midi" ? "Midi" : "Soir"),
          U.el("span", { class: "m4s-tdb-jour__b", style: "background:" + (couleurs[a.service] || "var(--bleu)") }),
          U.el("div", { class: "m4s-tdb-jour__tx" },
            U.el("b", {}, libelleDuStatut[a.type_code] || a.type_code),
            U.el("span", {}, "Service du " + a.service))));
      });
    }
    l2.append(cJour);
    zone.append(l2);

    // ===== Ligne 3 : effectifs par groupe + raccourcis =====
    const l3 = U.el("div", { class: "m4s-tdb-grille m4s-tdb-grille--2" });
    const cGrp = carte("Effectifs par groupe", IC.table, estAujourdHui ? "aujourd'hui" : jourActif.nom.toLowerCase());
    cGrp.append(U.el("div", { class: "m4s-tdb-grp m4s-tdb-grp--tete" },
      U.el("span", { class: "m4s-tdb-grp__nom" }, "Groupe"),
      U.el("span", { class: "m4s-tdb-grp__v" }, "Midi"),
      U.el("span", { class: "m4s-tdb-grp__v" }, "Soir")));
    let totM = 0, totS = 0;
    groupesHabites(groupes, residents).forEach(g => {
      const m = residents.filter(r => r.groupe_code === g.code && present(r, "midi")).length;
      const so = residents.filter(r => r.groupe_code === g.code && present(r, "soir")).length;
      totM += m; totS += so;
      cGrp.append(U.el("div", { class: "m4s-tdb-grp" },
        U.el("span", { class: "m4s-tdb-grp__nom" }, g.libelle || g.code),
        U.el("span", { class: "m4s-tdb-grp__v" }, String(m)),
        U.el("span", { class: "m4s-tdb-grp__v" }, serviceApplicable(g.code, "soir") ? String(so) : "—")));
    });
    cGrp.append(U.el("div", { class: "m4s-tdb-grp m4s-tdb-grp--tot" },
      U.el("span", { class: "m4s-tdb-grp__nom" }, "Total residents"),
      U.el("span", { class: "m4s-tdb-grp__v" }, String(totM)),
      U.el("span", { class: "m4s-tdb-grp__v" }, String(totS))));
    l3.append(cGrp);

    const cRac = carte("Actions frequentes", IC.eclair, "");
    const racs = U.el("div", { class: "m4s-tdb-racs" });
    const rac = (iconeD, lib, cle) => {
      const b = U.el("button", { class: "m4s-tdb-rac", type: "button", onclick: () => ROUTAGE.aller(cle) });
      b.append(icone(iconeD, 18), U.el("span", {}, lib));
      return b;
    };
    racs.append(rac(IC.residents, "Commande residents", "cmd-residents"));
    racs.append(rac(IC.encadrants, "Commande encadrants", "cmd-encadrants"));
    racs.append(rac(IC.cuisine, "Production cuisine", "production-cuisine"));
    racs.append(rac(IC.printer, "Tableau de presence", "tableau-presence"));
    cRac.append(racs);
    l3.append(cRac);
    zone.append(l3);
  }

  /* ===== [A1] COMMANDE REPAS RÉSIDENTS — grille hebdomadaire ==========
     Disposition (inspirée du gabarit MSP) :
       • les 7 jours en COLONNES, chacun scindé en MIDI / SOIR ;
       • les résidents en LIGNES, triés par groupe (G1→G4, ADJ) puis par nom ;
       • les résidents en accueil temporaire portent un badge « AT ».
     Une case verte « OK » = présent au repas : rien n'est stocké en base.
     Un clic sur une case ouvre la liste déroulante des statuts.
     ==================================================================== */
  async function vueCommandeResidents(conteneur, module) {
    conteneur.innerHTML = "";
    const semaine = ETAT.semaineActive;

    // Titre de page (hors carte, comme le gabarit)
    const entetePage = U.el("div", { class: "m4s-page-titre" },
      U.el("div", {},
        U.el("h1", {}, "Commande — Repas résidents"),
        U.el("div", { class: "m4s-sous" },
          semaine ? `S${semaine.numero} — ${semaine.annee} · du ${U.dateFR(semaine.dateDebut)} au ${U.dateFR(semaine.dateFin)}` : "")),
    );
    conteneur.append(entetePage);

    const zone = U.el("div");
    conteneur.append(zone);
    zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Chargement…")));

    if (!semaine) { zone.innerHTML = ""; zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Aucune semaine sélectionnée."))); return; }

    // Chargement : référentiels + résidents + commandes de la semaine
    let residents, types, groupes, etatSemaine, etatAnim;
    try {
      [groupes, types, residents, etatSemaine, etatAnim] = await Promise.all([
        PERSISTANCE.chargerGroupes(),
        PERSISTANCE.chargerTypesRepas(),
        PERSISTANCE.chargerResidentsPourCommande(),
        PERSISTANCE.chargerCommandes(semaine),
        PERSISTANCE.chargerAnimationsSemaine(semaine),
      ]);
    } catch (e) {
      zone.innerHTML = "";
      zone.append(U.el("div", { class: "m4s-carte" }, U.el("p", { class: "m4s-placeholder" }, "Impossible de charger : " + e.message)));
      return;
    }

    // Index des saisies existantes : "residentId|jour|service" → valeur
    const index = new Map();
    etatSemaine.commandes.forEach(c => index.set(`${c.resident_id}|${c.jour}|${c.service}`, c.valeur));

    // Index des ANIMATIONS PROGRAMMÉES : "jour|service" → [codes]
    // C'est ce paramétrage (écran « Animations de la semaine ») qui filtre
    // les choix proposés, comme la liste déroulante du classeur Excel.
    const animParJour = new Map();
    etatAnim.animations.forEach(a => {
      const k = `${a.jour}|${a.service}`;
      if (!animParJour.has(k)) animParJour.set(k, []);
      animParJour.get(k).push(a.type_code);
    });

    // Tri : ordre du groupe (référentiel) puis nom
    const rang = {}; groupes.forEach(g => { rang[g.code] = g.ordre ?? 99; });
    residents.sort((a, b) => {
      const ra = rang[a.groupe_code] ?? 99, rb = rang[b.groupe_code] ?? 99;
      if (ra !== rb) return ra - rb;
      return String(a.nom_prenom || "").localeCompare(String(b.nom_prenom || ""), "fr");
    });

    const jours = U.joursDeLaSemaine(semaine);
    const SERVICES = ["midi", "soir"];

    function dessiner() {
      const filtre = ETAT.filtreGroupeCommande || "TOUS";
      const recherche = (ETAT.rechercheCommande || "").trim().toLowerCase();
      let liste = (filtre === "TOUS") ? residents : residents.filter(r => (r.groupe_code || "") === filtre);
      if (recherche) liste = liste.filter(r => String(r.nom_prenom || "").toLowerCase().includes(recherche));

      zone.innerHTML = "";

      // --- Bandeau d'aide ---
      zone.append(U.el("div", { class: "m4s-info" },
        U.el("span", {}, "💡"),
        U.el("span", {}, "Cliquez sur une case pour choisir un statut. « OK » = présent au repas."),
        U.el("span", { class: "m4s-badge m4s-badge--at" }, "AT"),
        U.el("span", {}, "= accueil temporaire."),
      ));

      // --- Pastilles de filtre par groupe ---
      const barre = U.el("div", { class: "m4s-filtres", style: "margin-bottom:16px" });
      const pastille = (code, libelle) => U.el("button", {
        class: "m4s-filtre-btn" + (filtre === code ? " m4s-filtre-btn--actif" : ""),
        onclick: () => { ETAT.filtreGroupeCommande = code; dessiner(); },
      }, libelle);
      barre.append(pastille("TOUS", "Tous"));
      groupesHabites(groupes, residents).forEach(g => barre.append(pastille(g.code, g.libelle || g.code)));
      zone.append(barre);

      // --- Carte contenant le tableau ---
      const carte = U.el("div", { class: "m4s-carte" });

      const champRecherche = U.el("input", {
        class: "m4s-recherche", type: "search", placeholder: "Rechercher…", value: ETAT.rechercheCommande || "",
      });
      // Saisie fluide : on filtre sans reconstruire le champ (le focus est conservé)
      champRecherche.addEventListener("input", () => {
        ETAT.rechercheCommande = champRecherche.value;
        const curseur = champRecherche.selectionStart;
        dessiner();
        const nouveau = zone.querySelector(".m4s-recherche");
        if (nouveau) { nouveau.focus(); nouveau.setSelectionRange(curseur, curseur); }
      });

      carte.append(U.el("div", { class: "m4s-vue-titre" },
        U.el("h2", {}, `Présences — ${liste.length}`),
        U.el("div", { class: "m4s-actions" }, champRecherche),
      ));

      // --- Tableau : 2 colonnes fixes + 7 jours × (midi, soir) ---
      const cadre = U.el("div", { class: "m4s-tableau-cadre" });
      const trEntete = U.el("tr", {},
        U.el("th", {}, "Résident"),
        U.el("th", {}, "Régime"),
      );
      const COULEURS_JOUR = ["var(--lundi)", "var(--mardi)", "var(--mercredi)", "var(--jeudi)",
                             "var(--vendredi)", "var(--samedi)", "var(--dimanche)"];
      jours.forEach((j, i) => {
        const th = U.el("th", { class: "m4s-th-jour", colspan: 2, style: `border-bottom:2px solid ${COULEURS_JOUR[i]};border-left:3px solid color-mix(in srgb, ${COULEURS_JOUR[i]} 60%, transparent);background:color-mix(in srgb, ${COULEURS_JOUR[i]} 20%, var(--fond))` },
          U.el("div", { class: "m4s-jour-nom", style: `color:${COULEURS_JOUR[i]}` },
            `${j.nom.toUpperCase()} ${U.dateFR(j.date).slice(0, 5)}`),
          U.el("div", { class: "m4s-services" }, U.el("span", {}, "MIDI"), U.el("span", {}, "SOIR")),
        );
        trEntete.append(th);
      });
      const tbody = U.el("tbody");

      liste.forEach((r, idxLigne) => {
        const tdNom = U.el("td", { style: "font-weight:500;white-space:nowrap" }, r.nom_prenom || "—");
        if (r.type === "temporaire") tdNom.append(" ", U.el("span", { class: "m4s-badge m4s-badge--at" }, "AT"));

        const mixe = String(r.texture_code || "").toUpperCase().startsWith("M");
        const tdRegime = U.el("td", {},
          U.el("span", { class: "m4s-badge " + (mixe ? "m4s-badge--mixe" : "m4s-badge--normal") }, mixe ? "Mixé" : "Normal"));

        const tr = U.el("tr", {}, tdNom, tdRegime);

        jours.forEach((j, iJour) => {
          const jourCle = j.nom.toLowerCase();
          // Bande verticale par jour : couleur de l'en-tête, bien visible,
          // un peu plus soutenue une ligne sur deux (repère de lecture).
          const couleurJour = COULEURS_JOUR[iJour];
          const teinte = `color-mix(in srgb, ${couleurJour} ${idxLigne % 2 ? 30 : 18}%, white)`;
          const trait = `color-mix(in srgb, ${couleurJour} 60%, transparent)`;
          SERVICES.forEach((service, iServ) => {
            // [ADJ] Service non applicable → case neutre, rien d'enregistrable
            if (!serviceApplicable(r.groupe_code, service)) {
              tr.append(U.el("td", { class: "m4s-td-case", style: `background:${teinte}` +
                (iServ === 0 ? `;border-left:3px solid ${trait}` : "") }, caseNonApplicable()));
              return;
            }
            const cleIndex = `${r.id}|${jourCle}|${service}`;
            const bouton = U.el("button", { class: "m4s-case", type: "button" });
            majCase(bouton, index.get(cleIndex) || "", types);

            bouton.addEventListener("click", () => ouvrirMenuStatuts(
              bouton, types, index.get(cleIndex) || "",
              animParJour.get(`${jourCle}|${service}`) || [],
              async (valeur) => {
              const precedente = index.get(cleIndex) || "";
              bouton.disabled = true;
              try {
                await PERSISTANCE.enregistrerCommande({ semaine, residentId: r.id, jour: jourCle, service, valeur });
                if (valeur) index.set(cleIndex, valeur); else index.delete(cleIndex);
                majCase(bouton, valeur, types);
                toast("Enregistré.", "succes", 1200);
              } catch (e) {
                majCase(bouton, precedente, types);
                toast("Échec de l'enregistrement : " + e.message, "erreur", 6000);
              } finally { bouton.disabled = false; }
            }));

            const styleCase = `background:${teinte}` +
              (iServ === 0 ? `;border-left:3px solid ${trait}` : "");
            tr.append(U.el("td", { class: "m4s-td-case", style: styleCase }, bouton));
          });
        });

        tbody.append(tr);
      });

      cadre.append(U.el("table", { class: "m4s-tableau" }, U.el("thead", {}, trEntete), tbody));
      carte.append(cadre);
      if (!liste.length) carte.append(U.el("p", { class: "m4s-placeholder" }, "Aucun résident ne correspond."));
      zone.append(carte);
    }

    dessiner();
  }

  // Met à jour le libellé et la couleur d'une case selon le statut choisi
  function majCase(bouton, valeur, types) {
    bouton.classList.remove("m4s-case--animation", "m4s-case--sortie", "m4s-case--invitation", "m4s-case--autre");
    if (!valeur) { bouton.textContent = "OK"; bouton.title = "Présent au repas"; return; }
    const t = types.find(x => x.code === valeur);
    const cat = t?.categorie || "autre";
    bouton.textContent = valeur;
    bouton.title = t?.libelle || valeur;
    bouton.classList.add(`m4s-case--${["animation", "sortie", "invitation"].includes(cat) ? cat : "autre"}`);
  }

  // Liste déroulante des statuts, ouverte au clic sur une case.
  // `animationsAutorisees` = codes programmés pour CE jour et CE service
  // (écran « Animations de la semaine »). Les animations non programmées
  // ne sont pas proposées, exactement comme dans le classeur Excel.
  // Les autres catégories (sortie, invitation, autre) restent disponibles.
  function ouvrirMenuStatuts(ancre, types, valeurActuelle, animationsAutorisees, onChoix) {
    document.querySelectorAll(".m4s-menu-fond").forEach(n => n.remove());

    const fond = U.el("div", { class: "m4s-menu-fond" });
    const menu = U.el("div", { class: "m4s-menu" });

    const item = (valeur, libelle) => U.el("button", {
      class: "m4s-menu__item" + (valeur === valeurActuelle ? " m4s-menu__item--actif" : ""),
      type: "button",
      onclick: () => { fond.remove(); onChoix(valeur); },
    }, libelle);

    menu.append(U.el("div", { class: "m4s-menu__titre" }, "Présence"));
    menu.append(item("", "OK — présent au repas"));

    // Filtrage : on ne garde que les animations programmées ce jour-là.
    // La valeur déjà saisie reste visible même si le programme a changé
    // depuis (sinon elle deviendrait impossible à relire ou corriger).
    const visibles = types.filter(t => {
      if ((t.categorie || "") !== "animation") return true;
      return animationsAutorisees.includes(t.code) || t.code === valeurActuelle;
    });

    const parCategorie = {};
    visibles.forEach(t => { (parCategorie[t.categorie || "autre"] ||= []).push(t); });

    // Ordre d'affichage stable : animations d'abord, puis le reste
    const ordreCategories = ["animation", "sortie", "invitation", "autre"];
    ordreCategories.forEach(cat => {
      const items = parCategorie[cat];
      if (!items || !items.length) return;
      menu.append(U.el("div", { class: "m4s-menu__titre" }, cat));
      items.forEach(t => menu.append(item(t.code, `${t.code} — ${t.libelle}`)));
    });

    // Aucune animation programmée : on l'indique pour éviter la confusion
    if (!parCategorie["animation"] || !parCategorie["animation"].length) {
      menu.append(U.el("div", {
        class: "m4s-menu__titre",
        style: "text-transform:none;letter-spacing:0;font-weight:500;padding:8px 10px",
      }, "Aucune animation programmée pour ce jour. Renseignez-les dans « Animations de la semaine »."));
    }

    fond.append(menu);
    fond.addEventListener("click", e => { if (e.target === fond) fond.remove(); });
    document.body.append(fond);
    positionnerMenu(menu, ancre);

    document.addEventListener("keydown", function esc(e) {
      if (e.key === "Escape") { fond.remove(); document.removeEventListener("keydown", esc); }
    });
  }


  /* -------------------------------------------------------------------
     [SEC-4.8] ROUTAGE / VUES
     ------------------------------------------------------------------- */
  // Icônes de navigation (trait, 18x18) par clé de module. Purement
  // decoratif : un module absent de cette table s'affiche simplement
  // sans icône, sans jamais casser le clic ni le routage.
  const NAV_ICONES = {
    "tableau-de-bord": '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
    "anim-semaine":    '<path d="M12 2l2 5 5 .5-4 3.5 1.5 5L12 18l-4.5 3 1.5-5-4-3.5 5-.5z"/>',
    "cmd-residents":   '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/>',
    "cmd-encadrants":  '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    "cmd-familles":    '<path d="M3 21h18M4 21V10l8-6 8 6v11M9 21v-5h6v5"/>',
    "dotations":       '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    "tableau-presence":'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/>',
    "repas-animation": '<path d="M8 3v3M16 3v3M4 8h16M6 6h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2z"/>',
    "production-cuisine":'<path d="M4 3h16v4H4zM6 7v14M18 7v14M6 21h12M9 11h6M9 15h6"/>',
    "residents":       '<path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6M19 8v6"/>',
    "accueil-temp":    '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><circle cx="12" cy="15" r="2.5"/>',
    "animations":      '<path d="M12 2l2 5 5 .5-4 3.5 1.5 5L12 18l-4.5 3 1.5-5-4-3.5 5-.5z"/>',
    "salles":          '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/>',
    "textures":        '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    "cat-encadrants":  '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    "cat-dotations":   '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    "planning":        '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/>',
    "etat-familles":   '<path d="M4 3h16v4H4zM6 7v14M18 7v14M6 21h12"/>',
    "indicateurs":     '<path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-4 4"/>',
  };
  // Construit un bouton de nav avec icône (si connue) + libellé, en
  // conservant EXACTEMENT le même data-cle et le même onclick que l'ancien
  // code (aucun changement de comportement, seulement de présentation).
  function boutonNav(cle, titre, classes) {
    const btn = U.el("button", { class: classes, "data-cle": cle, onclick: () => ROUTAGE.aller(cle) });
    const svg = NAV_ICONES[cle];
    if (svg) btn.append(U.el("span", { class: "m4s-nav__ic", html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + svg + "</svg>" }));
    btn.append(document.createTextNode(titre));
    return btn;
  }

  const ROUTAGE = {
    construireNav() {
      const nav = U.$("#app-nav"); nav.innerHTML = "";
      // Module d'accueil (Tableau de bord) : lien isole, en tete, hors poles
      const accueil = MODULES.find(m => m.pole === "ACCUEIL");
      if (accueil) nav.append(boutonNav(accueil.cle, accueil.titre, "m4s-nav__lien m4s-nav__lien--accueil"));
      Object.entries(POLES).forEach(([code, libelle]) => {
        const bloc = U.el("div", { class: "m4s-nav__pole" }, U.el("div", { class: "m4s-nav__pole-titre" }, libelle));
        MODULES.filter(m => m.pole === code).forEach(m => {
          bloc.append(boutonNav(m.cle, m.titre, "m4s-nav__lien"));
        });
        nav.append(bloc);
      });
    },
    aller(cle) {
      const module = MODULES.find(m => m.cle === cle);
      if (!module) return;
      ETAT.moduleActif = cle;
      document.querySelectorAll(".m4s-nav__lien").forEach(l => l.classList.toggle("m4s-nav__lien--actif", l.dataset.cle === cle));
      const conteneur = U.$("#app-vues");
      Promise.resolve(module.afficher(conteneur, module)).catch(e => {
        conteneur.innerHTML = "";
        conteneur.append(U.el("div", { class: "m4s-carte" }, "Erreur : " + e.message));
      });
    },
  };

  /* -------------------------------------------------------------------
     [SEC-4.8b] SEMAINES — sélecteur, navigation et semaine active
     Les semaines sont CALCULÉES (norme ISO), pas saisies : le sélecteur
     propose une plage glissante autour de la semaine courante. La ligne
     n'est créée en base qu'au moment où l'on y enregistre des données.
     ------------------------------------------------------------------- */
  const SEMAINES = {
    // Nombre de semaines proposées avant / après la semaine courante
    passe: 12,
    futur: 12,

    // Construit la liste des semaines proposées dans le sélecteur
    listeProposee() {
      const courante = U.semaineDe(new Date());
      const liste = [];
      for (let i = -SEMAINES.passe; i <= SEMAINES.futur; i++) liste.push(U.semaineDecalee(courante, i));
      return liste;
    },

    // Libellé affiché : « S30 · 20/07 → 26/07/2026 »
    libelle(s) {
      return `S${s.numero} · ${U.dateFR(s.dateDebut).slice(0, 5)} → ${U.dateFR(s.dateFin)}`;
    },

    // Applique une semaine comme semaine active, puis rafraîchit la vue
    definirActive(semaine, rafraichirVue = true) {
      ETAT.semaineActive = semaine;
      PERSISTANCE.memoriserSemaine(semaine.cle);
      const sel = U.$("#select-semaine");
      // Si la semaine sort de la plage proposée, on reconstruit la liste autour d'elle
      if (sel && !Array.from(sel.options).some(o => o.value === semaine.cle)) SEMAINES.remplirSelecteur(semaine);
      else if (sel) sel.value = semaine.cle;
      SEMAINES.majIndicateur();
      if (rafraichirVue && ETAT.moduleActif) ROUTAGE.aller(ETAT.moduleActif);
    },

    // (Re)remplit la liste déroulante ; centrée sur la semaine fournie si besoin
    remplirSelecteur(centreSur) {
      const sel = U.$("#select-semaine");
      if (!sel) return;
      let liste = SEMAINES.listeProposee();
      // Si la semaine demandée est hors plage, on recentre la plage sur elle
      if (centreSur && !liste.some(s => s.cle === centreSur.cle)) {
        liste = [];
        for (let i = -SEMAINES.passe; i <= SEMAINES.futur; i++) liste.push(U.semaineDecalee(centreSur, i));
      }
      sel.innerHTML = "";
      liste.forEach(s => sel.append(U.el("option", { value: s.cle }, SEMAINES.libelle(s))));
      if (ETAT.semaineActive) sel.value = ETAT.semaineActive.cle;
    },

    // Affiche « Semaine en cours » quand la semaine active est celle d'aujourd'hui
    majIndicateur() {
      const ind = U.$("#semaine-indicateur");
      if (!ind) return;
      const courante = U.semaineDe(new Date());
      const estCourante = ETAT.semaineActive && ETAT.semaineActive.cle === courante.cle;
      ind.textContent = estCourante ? "Semaine en cours" : "";
      ind.style.display = estCourante ? "" : "none";
    },

    // Branche les contrôles de l'en-tête (précédent / suivant / aujourd'hui / liste)
    brancher() {
      const sel = U.$("#select-semaine");
      sel.onchange = () => {
        // On reconstruit la semaine depuis sa clé "AAAA-Www" (indépendant de la liste).
        // Le 4 janvier appartient toujours à la semaine 1 au sens ISO → base fiable.
        const [annee, sem] = sel.value.split("-W");
        const base = U.semaineDe(new Date(Date.UTC(Number(annee), 0, 4)));
        SEMAINES.definirActive(U.semaineDecalee(base, Number(sem) - 1));
      };
      U.$("#btn-semaine-prec").onclick = () => SEMAINES.definirActive(U.semaineDecalee(ETAT.semaineActive, -1));
      U.$("#btn-semaine-suiv").onclick = () => SEMAINES.definirActive(U.semaineDecalee(ETAT.semaineActive, +1));
      U.$("#btn-semaine-auj").onclick  = () => SEMAINES.definirActive(U.semaineDe(new Date()));
    },

    // Initialisation au démarrage : semaine mémorisée, sinon semaine courante
    initialiser() {
      const courante = U.semaineDe(new Date());
      const memorisee = PERSISTANCE.lireSemaineMemorisee();
      let active = courante;
      if (memorisee) {
        const trouvee = SEMAINES.listeProposee().find(s => s.cle === memorisee);
        if (trouvee) active = trouvee;
      }
      ETAT.semaineActive = active;
      SEMAINES.remplirSelecteur(active);
      SEMAINES.brancher();
      SEMAINES.majIndicateur();
    },
  };

  /* -------------------------------------------------------------------
     [SEC-4.11] INITIALISATION — point d'entrée unique
     ------------------------------------------------------------------- */
  function afficherApp(connecte) {
    U.$("#ecran-login").style.display = connecte ? "none" : "flex";
    U.$("#app").classList.toggle("m4s-app--visible", connecte);
  }

  async function demarrerApp() {
    U.$("#app-version").textContent = CONFIG.version;
    U.$("#app-user").textContent = ETAT.utilisateur?.email || "";
    ROUTAGE.construireNav();
    SEMAINES.initialiser();
    ROUTAGE.aller("tableau-de-bord");
    afficherApp(true);
  }

  function brancherLogin() {
    const btn = U.$("#btn-connexion"), err = U.$("#login-erreur");
    const tenter = async () => {
      err.textContent = "";
      const email = U.$("#login-email").value.trim(), mdp = U.$("#login-mdp").value;
      if (!email || !mdp) { err.textContent = "Renseignez l'e-mail et le mot de passe."; return; }
      btn.disabled = true; btn.textContent = "Connexion…";
      try { await AUTH.connecter(email, mdp); if (CONFIG.modeTest) TEST.memoriser(email, mdp); await demarrerApp(); }
      catch (e) { err.textContent = e.message; }
      finally { btn.disabled = false; btn.textContent = "Se connecter"; }
    };
    btn.addEventListener("click", tenter);
    ["login-email", "login-mdp"].forEach(id => U.$("#" + id).addEventListener("keydown", e => { if (e.key === "Enter") tenter(); }));
  }

  function brancherDeconnexion() {
    U.$("#btn-deconnexion").addEventListener("click", async () => {
      await AUTH.deconnecter(); if (CONFIG.modeTest) TEST.oublier(); afficherApp(false); U.$("#login-mdp").value = "";
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    brancherLogin(); brancherDeconnexion();
    const ok = await AUTH.restaurer();
    if (ok) { await demarrerApp(); return; }
    // [TEST] Reconnexion auto avec les identifiants memorises (si mode test)
    if (CONFIG.modeTest) {
      const c = TEST.lire();
      if (c && c.email && c.mdp) {
        U.$("#login-email").value = c.email;
        U.$("#login-mdp").value = c.mdp;
        try { await AUTH.connecter(c.email, c.mdp); await demarrerApp(); return; }
        catch (_) { TEST.oublier(); }
      }
    }
    afficherApp(false);
  });
  </script>
